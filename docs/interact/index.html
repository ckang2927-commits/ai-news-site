<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script src="https://unpkg.com/@mediapipe/hands@0.4.1675469240/hands.js"></script>

<script type="module">
import*as THREE from 'three';
const C={N:24000,speed:4.5,boom:6,damp:.92,st:.02,sp:20,dp:.5,cd:.25,sm:10};
const $=s=>document.querySelector(s);
const lb=$('#lb'),lt=$('#lt'),gt=$('#gt'),gn=$('#gn'),gl=$('#gl'),dh=$('#dh'),hu=$('#hu'),pm=$('#pm'),w=$('#w'),mc=$('#main'),dc=$('#debug');
function pr(p,t){lb.style.width=p+'%';if(t)lt.textContent=t}
const d3=(a,b)=>Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2+(a.z-b.z)**2);

// Text -> particle positions
function txP(tx,n,s){
  const c=document.createElement('canvas');c.width=512;c.height=160;
  const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,512,160);
  x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';
  let fs=95;if(tx.length>=4)fs=62;else if(tx.length>=3)fs=75;
  x.font='bold '+fs+'px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
  x.fillText(tx,256,80);
  const d=x.getImageData(0,0,512,160).data,pts=[];
  for(let y=0;y<160;y+=2)for(let x=0;x<512;x+=2)if(d[(y*512+x)*4]>128)pts.push({x:(x-256)/55*s,y:(80-y)/55*s});
  const p=new Float32Array(n*3);
  if(pts.length<5){for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*s*2;p[i*3+1]=(Math.random()-.5)*s*.6;p[i*3+2]=(Math.random()-.5)*s*.2}return p}
  for(let i=0;i<n;i++){const p2=pts[Math.floor(Math.random()*pts.length)];p[i*3]=p2.x+(Math.random()-.5)*.03;p[i*3+1]=p2.y+(Math.random()-.5)*.03;p[i*3+2]=(Math.random()-.5)*s*.06}
  return p;
}
function spP(n,r){const p=new Float32Array(n*3);for(let i=0;i<n;i++){const t=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t)}return p}
function rdP(n,r){const p=new Float32Array(n*3);for(let i=0;i<n;i++){p[i*3]=(Math.random()-.5)*r*2;p[i*3+1]=(Math.random()-.5)*r*2;p[i*3+2]=(Math.random()-.5)*r*2}return p}
function asP(n,s){const p=new Float32Array(n*3);const bd=Math.floor(n*.65),rg=n-bd;const sc=s*1.5;for(let i=0;i<bd;i++){const t=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);const r=sc*(.35+Math.random()*.25)*(.8+.3*Math.sin(t*4)*Math.cos(ph*3));p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(t)}for(let i=0;i<rg;i++){const a=Math.random()*Math.PI*2;const r=sc*(.7+Math.random()*.6);const idx=bd+i;p[idx*3]=r*Math.cos(a);p[idx*3+1]=r*Math.sin(a)*.35+(Math.random()-.5)*sc*.05;p[idx*3+2]=r*Math.sin(a)*.6}return p}
const G={0:{l:"✊ 小行星",g:()=>asP(C.N,1.8)},1:{l:"☝️ 我",g:()=>txP("我",C.N,2.0)},2:{l:"✌️ 爱",g:()=>txP("爱",C.N,2.0)},3:{l:"🤟 欣欣",g:()=>txP("欣欣",C.N,2.2)},4:{l:"🖐️ 我爱欣欣",g:()=>txP("我爱欣欣",C.N,2.5)},5:{l:"✋ 球形",g:()=>spP(C.N,1.8)}};

// ═══ SIMPLE FINGER COUNTER (y-coordinate, most reliable) ═══
function cF(lm){
  if(!lm||lm.length<21)return-1;
  let n=0;
  // Thumb: tip(4) should be above IP(3) AND spread from index
  if(lm[4].y<lm[3].y-.015&&Math.sqrt((lm[4].x-lm[5].x)**2+(lm[4].y-lm[5].y)**2)>.04)n++;
  // Index: tip(8) above PIP(6)
  if(lm[8].y<lm[6].y-.018)n++;
  // Middle: tip(12) above PIP(10)
  if(lm[12].y<lm[10].y-.018)n++;
  // Ring: tip(16) above PIP(14)
  if(lm[16].y<lm[14].y-.018)n++;
  // Pinky: tip(20) above PIP(18)
  if(lm[20].y<lm[18].y-.018)n++;
  return n;
}

// ═══ SMOOTH (simple majority vote) ═══
let fH=[];
function sm(v){
  if(v<0)return-1;
  fH.push(v);if(fH.length>C.sm)fH.shift();
  const t={};for(const x of fH)t[x]=(t[x]||0)+1;
  let b=0,bn=0;for(const[k,c]of Object.entries(t))if(c>bn){bn=c;b=parseInt(k)}
  return bn>=fH.length*.5?b:-1;
}

// ═══ DEBUG DRAW ═══
function drawDbg(lm,ctx,w,h){
  ctx.clearRect(0,0,w,h);
  if(!lm)return;
  const cn=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]];
  ctx.strokeStyle='rgba(6,182,212,.35)';ctx.lineWidth=1.2;
  for(const[i,j]of cn){ctx.beginPath();ctx.moveTo(lm[i].x*w,lm[i].y*h);ctx.lineTo(lm[j].x*w,lm[j].y*h);ctx.stroke()}
  const tips=[4,8,12,16,20],cs=['#f472b6','#22d3ee','#818cf8','#34d399','#fbbf24'];
  for(let f=0;f<5;f++){ctx.fillStyle=cs[f];ctx.beginPath();ctx.arc(lm[tips[f]].x*w,lm[tips[f]].y*h,3.5,0,Math.PI*2);ctx.fill()}
  ctx.fillStyle='#64748b';ctx.beginPath();ctx.arc(lm[0].x*w,lm[0].y*h,2.5,0,Math.PI*2);ctx.fill();
}

// ═══ PARTICLE SYSTEM ═══
class PS{
  constructor(){
    this.N=C.N;this.pos=new Float32Array(this.N*3);this.vel=new Float32Array(this.N*3);
    this.acc=new Float32Array(this.N*3);this.tgt=new Float32Array(this.N*3);this.siz=new Float32Array(this.N);
    this.col=new Float32Array(this.N*3);this.key=null;this.storm={x:0,y:0,z:0};this.depth=1;
    this.bt=0;this.bd=.25;this.bo=false;this.rot=0;
    const s=rdP(this.N,4.5);this.pos.set(s);this.tgt.set(s);
    for(let i=0;i<this.N;i++){this.siz[i]=.02+Math.random()*.05;this.col[i*3]=.1+Math.random()*.3;this.col[i*3+1]=.4+Math.random()*.45;this.col[i*3+2]=.5+Math.random()*.45}
    this._gl()
  }
  _gl(){
    this.r=new THREE.WebGLRenderer({canvas:mc,antialias:true});
    this.r.setPixelRatio(Math.min(devicePixelRatio,2));this.r.setSize(innerWidth,innerHeight);
    this.r.setClearColor(0x070714);
    this.s=new THREE.Scene();this.c=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);
    this.c.position.z=5.5;
    // Stars
    const sg=new THREE.BufferGeometry(),sp=new Float32Array(500*3);
    for(let i=0;i<500;i++){sp[i*3]=(Math.random()-.5)*50;sp[i*3+1]=(Math.random()-.5)*50;sp[i*3+2]=(Math.random()-.5)*50-12}
    sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
    this.s.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0x334488,size:.025,transparent:true,opacity:.3})));
    // Connectors
    const cn=120;this.cN=new Float32Array(cn*3);
    for(let i=0;i<cn;i++){this.cN[i*3]=(Math.random()-.5)*4;this.cN[i*3+1]=(Math.random()-.5)*4;this.cN[i*3+2]=(Math.random()-.5)*4}
    this.cP=[];for(let i=0;i<cn;i++)for(let j=i+1;j<cn;j++)if(Math.random()<.05)this.cP.push([i,j]);
    const lp=new Float32Array(this.cP.length*6),lg=new THREE.BufferGeometry();
    lg.setAttribute('position',new THREE.BufferAttribute(lp,3));
    this.ln=new THREE.LineSegments(lg,new THREE.LineBasicMaterial({color:0x06b6d4,transparent:true,opacity:.05,blending:THREE.AdditiveBlending}));
    this.s.add(this.ln);this._lp=lp;
    // Particles
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(this.pos,3));
    geo.setAttribute('size',new THREE.BufferAttribute(this.siz,1));
    geo.setAttribute('color',new THREE.BufferAttribute(this.col,3));
    const vs='attribute float size;attribute vec3 color;varying vec3 vc;varying float va;void main(){vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=size*(350.0/-mv.z);gl_Position=projectionMatrix*mv;vc=color;va=.6+.4*(1.0-abs(position.x)/8.0)}';
    const fs='varying vec3 vc;varying float va;uniform float t;void main(){vec2 c=gl_PointCoord-vec2(.5);float d=length(c);if(d>.5)discard;float a=smoothstep(.5,0.,d)*va*.85;float g=exp(-d*12.0);vec3 col=vc+vec3(.15,.2,.25)*g;gl_FragColor=vec4(col,a)}';
    this.mesh=new THREE.Points(geo,new THREE.ShaderMaterial({uniforms:{t:{value:0}},vertexShader:vs,fragmentShader:fs,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
    this.s.add(this.mesh);
    onresize=()=>{this.c.aspect=innerWidth/innerHeight;this.c.updateProjectionMatrix();this.r.setSize(innerWidth,innerHeight)}
  }
  setTarget(k){
    if(k===this.key)return;this.key=k;const g=G[k];if(!g)return;
    this.tgt.set(g.g());this.bo=true;this.bt=0;
    for(let i=0;i<this.N;i++){this.vel[i*3]+=(Math.random()-.5)*C.boom;this.vel[i*3+1]+=(Math.random()-.5)*C.boom;this.vel[i*3+2]+=(Math.random()-.5)*C.boom}
    gt.textContent=k+' · '+G[k].l;gl.classList.add('on');gn.textContent=k;gn.classList.add('ok');setTimeout(()=>gl.classList.remove('on'),1000)
  }
  addStorm(dx,dy,s){this.storm.x+=dx*s;this.storm.y+=dy*s;this.storm.z+=(Math.random()-.5)*s*.15}
  setDepth(s){this.depth=s}
  update(dt){
    dt=Math.min(dt,.05);this.rot+=dt*.06;
    if(this.bo){this.bt+=dt;if(this.bt>this.bd)this.bo=false}
    const ep=this.bo?Math.min(this.bt/this.bd,1):1,sd=Math.exp(-dt*4),attr=this.bo?C.speed*.5:C.speed;
    const df=this.depth>1.1?(this.depth-1)*C.dp*3:this.depth<.85?-(1-this.depth)*C.dp*3:0;
    for(let i=0;i<this.cN.length/3;i++){this.cN[i*3]+=(Math.random()-.5)*.004;this.cN[i*3+1]+=(Math.random()-.5)*.004;this.cN[i*3+2]+=(Math.random()-.5)*.004;this.cN[i*3]*=.99;this.cN[i*3+1]*=.99;this.cN[i*3+2]*=.99}
    const lp=this._lp,pp=this.cP;let ii=0;
    for(const[i,j]of pp){const dx=this.cN[i*3]-this.cN[j*3],dy=this.cN[i*3+1]-this.cN[j*3+1],dz=this.cN[i*3+2]-this.cN[j*3+2];if(Math.sqrt(dx*dx+dy*dy+dz*dz)<2){lp[ii*6]=this.cN[i*3];lp[ii*6+1]=this.cN[i*3+1];lp[ii*6+2]=this.cN[i*3+2];lp[ii*6+3]=this.cN[j*3];lp[ii*6+4]=this.cN[j*3+1];lp[ii*6+5]=this.cN[j*3+2];ii++}}
    for(let i=ii*6;i<lp.length;i++)lp[i]=0;this.ln.geometry.attributes.position.needsUpdate=true;this.ln.geometry.setDrawRange(0,ii*2);
    for(let i=0;i<this.N;i++){const i3=i*3,dx=this.tgt[i3]-this.pos[i3],dy=this.tgt[i3+1]-this.pos[i3+1],dz=this.tgt[i3+2]-this.pos[i3+2];
      this.acc[i3]=dx*attr+this.storm.x*(1-ep)+this.pos[i3]*df;this.acc[i3+1]=dy*attr+this.storm.y*(1-ep)+this.pos[i3+1]*df;this.acc[i3+2]=dz*attr+this.storm.z*(1-ep)+this.pos[i3+2]*df;
      this.vel[i3]+=this.acc[i3]*dt;this.vel[i3+1]+=this.acc[i3+1]*dt;this.vel[i3+2]+=this.acc[i3+2]*dt;
      this.vel[i3]*=C.damp;this.vel[i3+1]*=C.damp;this.vel[i3+2]*=C.damp;
      this.pos[i3]+=this.vel[i3]*dt;this.pos[i3+1]+=this.vel[i3+1]*dt;this.pos[i3+2]+=this.vel[i3+2]*dt}
    this.storm.x*=sd;this.storm.y*=sd;this.storm.z*=sd;
    this.mesh.geometry.attributes.position.needsUpdate=true;this.mesh.material.uniforms.t.value+=dt
  }
  render(){this.r.render(this.s,this.c)}
}

let ps,mPos=[],cyc=0,CYC=[0,1,2,3,4,5];

// ═══ HAND TRACKING ═══
let hPos=[],pK=-1,cd=0,idle=0;
function onH(r){
  if(!r.multiHandLandmarks||!r.multiHandLandmarks.length){
    idle+=.03;if(idle>1.5){gt.textContent='✊ 等待手势';gn.textContent='-';gn.classList.remove('ok')}
    const x=dc.getContext('2d');if(x)x.clearRect(0,0,dc.width,dc.height);return
  }
  idle=0;const lm=r.multiHandLandmarks[0];
  // Storm
  hPos.push({x:lm[0].x,y:lm[0].y});if(hPos.length>6)hPos.shift();
  if(hPos.length>=3){const p1=hPos[hPos.length-3],p2=hPos[hPos.length-1],sp=Math.sqrt((p2.x-p1.x)**2+(p2.y-p1.y)**2);if(sp>C.st&&ps)ps.addStorm((p2.x-p1.x)/sp,-(p2.y-p1.y)/sp,Math.min(sp*C.sp,C.sp*2))}
  // Depth
  let mx=1,xx=0,my=1,xy=0;for(const p of lm){if(p.x<mx)mx=p.x;if(p.x>xx)xx=p.x;if(p.y<my)my=p.y;if(p.y>xy)xy=p.y}
  const ba=(xx-mx)*(xy-my);if(ps)ps.setDepth(Math.max(.3,Math.min(4,ba*15)));
  if(ba<.03)dh.textContent='📏 手太远了，靠近30~50cm';else if(ba>.45)dh.textContent='📏 手太近了，离远一点';else dh.textContent='✅ 距离合适！';
  // Finger count
  cd-=.03;
  const raw=cF(lm),k=sm(raw);
  if(cd<=0&&k>=0&&k<=5&&k!==pK&&ps){pK=k;cd=C.cd;ps.setTarget(k)}
  // Draw debug
  const x=dc.getContext('2d');if(x&&dc.classList.contains('show')){dc.width=dc.clientWidth*(devicePixelRatio||1);dc.height=dc.clientHeight*(devicePixelRatio||1);const s=dc.width/160;x.scale(s,s);drawDbg(lm,x,160,120)}
}

// ═══ MOUSE ═══
function setupM(){
  const h=(x,y)=>{mPos.push({x,y});if(mPos.length>6)mPos.shift();if(mPos.length>=3){const p1=mPos[mPos.length-3],p2=mPos[mPos.length-1],sp=Math.sqrt((p2.x-p1.x)**2+(p2.y-p1.y)**2);if(sp>.01&&ps)ps.addStorm((p2.x-p1.x)/Math.max(sp,.001),-(p2.y-p1.y)/Math.max(sp,.001),Math.min(sp*350,35))}};
  mc.addEventListener('mousemove',e=>h(e.clientX/innerWidth,e.clientY/innerHeight));
  mc.addEventListener('click',()=>{if(!ps)return;cyc=(cyc+1)%CYC.length;ps.setTarget(CYC[cyc])});
  mc.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches[0];h(t.clientX/innerWidth,t.clientY/innerHeight)},{passive:false});
  mc.addEventListener('touchstart',e=>{e.preventDefault();if(!ps)return;cyc=(cyc+1)%CYC.length;ps.setTarget(CYC[cyc])},{passive:false});
  setTimeout(()=>{if(ps){ps.setTarget(0);gn.textContent='0';gn.classList.add('ok');gt.textContent='0 · ✊ 小行星'}},600)
}

// ═══ CAMERA ═══
async function startC(){
  pm.classList.remove('show');hu.classList.add('hidden');dh.classList.remove('hidden');dc.classList.add('show');
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
    w.srcObject=s;await w.play();pr(60,'加载识别...');
    const h2=new Hands({locateFile:f=>'https://unpkg.com/@mediapipe/hands@0.4.1675469240/'+f});
    h2.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.5,minTrackingConfidence:.3});
    h2.onResults(onH);const cm=new Camera(w,{onFrame:async()=>{try{await h2.send({image:w})}catch(e){}},width:640,height:480});
    pr(85,'就绪！');await cm.start();pr(100);setTimeout(()=>$('#loading').classList.add('hidden'),200)
  }catch(e){console.warn(e);gt.textContent='🖱️ 鼠标模式 · 点击切换';dc.classList.remove('show');setupM();pr(100);setTimeout(()=>$('#loading').classList.add('hidden'),200)}
}
function skipC(){pm.classList.remove('show');gt.textContent='🖱️ 鼠标模式 · 点击切换形态';dc.classList.remove('show');setupM();pr(100);setTimeout(()=>$('#loading').classList.add('hidden'),200)}

// ═══ BOOT ═══
async function boot(){
  pr(10,'启动粒子...');ps=new PS();pr(50,'渲染就绪');
  await new Promise(r=>setTimeout(r,100));pm.classList.add('show');
  $('#b1').onclick=startC;$('#b2').onclick=skipC;
  let l=performance.now();function lp(){const n=performance.now(),dt=(n-l)/1000;l=n;if(ps){ps.update(dt);ps.render()}requestAnimationFrame(lp)}lp()
}
boot();
</script>
