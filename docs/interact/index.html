<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#070714;font-family:sans-serif;-webkit-font-smoothing:antialiased}

#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070714;z-index:1000;transition:opacity .8s}

@keyframes spin{to{transform:rotate(360deg)}}

#loading .bar{width:180px;height:2px;background:rgba(255,255,255,.05);border-radius:2px;margin-top:8px;overflow:hidden}
#loading .bar-inner{height:100%;width:0%;background:linear-gradient(90deg,#06b6d4,#6366f1);border-radius:2px;transition:width .3s}

.back-btn{width:34px;height:34px;border-radius:50%;background:rgba(10,10,26,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.06);color:#94a3b8;font-size:14px;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:all .2s;cursor:pointer;position:absolute;left:16px}

#gl{display:flex;align-items:center;gap:8px;background:rgba(10,10,26,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:4px 14px 4px 16px;transition:all .3s}
#gl.glow{border-color:rgba(6,182,212,.25);box-shadow:0 0 20px rgba(6,182,212,.06)}

#prompt{position:fixed;inset:0;z-index:2000;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(7,7,20,.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

  canvas#debug{width:120px;height:90px;bottom:10px;right:10px}
  #guide{font-size:9px;bottom:48px}

}
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p id="load-text">启动中...</p>
  <div class="bar"><div class="bar-inner" id="load-bar"></div></div>
</div>

<div id="prompt">
  <div class="icon">📷</div>
  <h2>启用手势交互</h2>
  <p>摄像头识别手指 · 本地处理不上传</p>
  <div class="row">
    <button class="btn1" id="btn-cam">启用摄像头</button>
    <button class="btn2" id="btn-skip">鼠标/触控模式</button>
  </div>
</div>

<div id="top">
  <a href="../index.html" class="back-btn">←</a>
  <div id="gl">
    <span class="txt" id="gl-txt">👋 等待手势</span>
    <span class="num" id="gl-num">-</span>
  </div>
</div>
<div id="dist-hint">📏 距离摄像头 30~50cm · 手掌正对镜头 · 手指分开</div>
<div id="guide">☝️1「我」 ✌️2「爱」 🤟3「欣欣」 🖐️4「我爱欣欣」 ✋5「球形」 · 快速滑动起风暴</div>

<video id="webcam" playsinline></video>
<canvas id="main"></canvas>
<canvas id="debug"></canvas>

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script src="https://unpkg.com/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin></script>
<script src="https://unpkg.com/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin></script>

<script type="module">
import * as THREE from 'three';

// ═══════ CONFIG
const C = {
  N: 24000,
  speed: 10,
  boom: 6,
  damp: 0.92,
  stormThresh: 0.02,
  stormPow: 22,
  depthSens: 0.5,
  cooldown: 0.2,
  smooth: 6
};

// ═══════ DOM
const $ = s => document.querySelector(s);
const loadBar = $('#load-bar'), loadTxt = $('#load-text');
const glTxt = $('#gl-txt'), glNum = $('#gl-num'), gl = $('#gl');
const guide = $('#guide'), distHint = $('#dist-hint');
const prompt = $('#prompt'), video = $('#webcam');
const mainCanvas = $('#main'), debugCanvas = $('#debug');

function prog(p, t) {
  loadBar.style.width = p + '%';
  if (t) loadTxt.textContent = t;
}

// ═══════ 3D DIST
const d3 = (a, b) => Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2 + (a.z-b.z)**2);
const d2 = (a, b) => Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);

// ═══════ TEXT → POSITIONS
function textPts(text, n, scale) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 160;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 512, 160);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let fs = 95;
  if (text.length >= 4) fs = 62;
  else if (text.length >= 3) fs = 75;
  ctx.font = `bold ${fs}px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif`;
  ctx.fillText(text, 256, 80);
  const d = ctx.getImageData(0, 0, 512, 160).data;
  const pts = [];
  for (let y = 0; y < 160; y += 2)
    for (let x = 0; x < 512; x += 2)
      if (d[(y*512+x)*4] > 128)
        pts.push({ x: (x-256)/55*scale, y: (80-y)/55*scale });
  const pos = new Float32Array(n*3);
  if (pts.length < 5) {
    for (let i = 0; i < n; i++) {
      pos[i*3] = (Math.random()-0.5)*scale*2;
      pos[i*3+1] = (Math.random()-0.5)*scale*.6;
      pos[i*3+2] = (Math.random()-0.5)*scale*.2;
    }
    return pos;
  }
  for (let i = 0; i < n; i++) {
    const p = pts[Math.floor(Math.random()*pts.length)];
    pos[i*3] = p.x + (Math.random()-.5)*.03;
    pos[i*3+1] = p.y + (Math.random()-.5)*.03;
    pos[i*3+2] = (Math.random()-.5)*scale*.06;
  }
  return pos;
}

function spherePts(n, r) {
  const p = new Float32Array(n*3);
  for (let i = 0; i < n; i++) {
    const t = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
    p[i*3] = r*Math.sin(ph)*Math.cos(t);
    p[i*3+1] = r*Math.cos(ph);
    p[i*3+2] = r*Math.sin(ph)*Math.sin(t);
  }
  return p;
}

function rndPts(n, r) {
  const p = new Float32Array(n*3);
  for (let i = 0; i < n; i++) {
    p[i*3] = (Math.random()-.5)*r*2;
    p[i*3+1] = (Math.random()-.5)*r*2;
    p[i*3+2] = (Math.random()-.5)*r*2;
  }
  return p;
}

const G = {
  1: { l: '我', g: () => textPts('我', C.N, 2.0) },
  2: { l: '爱', g: () => textPts('爱', C.N, 2.0) },
  3: { l: '欣欣', g: () => textPts('欣欣', C.N, 2.2) },
  4: { l: '我爱欣欣', g: () => textPts('我爱欣欣', C.N, 2.5) },
  5: { l: '球形', g: () => spherePts(C.N, 1.8) }
};

// ═══════ 🔥 ROBUST FINGER COUNTER (multi-method majority vote)
function countFingers(lm) {
  if (!lm || lm.length < 21) return -1;

  const wrist = lm[0], palm = lm[9];
  const handSz = d3(wrist, lm[5]); // wrist to index MCP
  if (handSz < 0.005) return -1;

  // Palm center
  const pc = {
    x: (lm[0].x+lm[5].x+lm[9].x+lm[13].x+lm[17].x)/5,
    y: (lm[0].y+lm[5].y+lm[9].y+lm[13].y+lm[17].y)/5,
    z: (lm[0].z+lm[5].z+lm[9].z+lm[13].z+lm[17].z)/5
  };

  const tips = [4, 8, 12, 16, 20];
  const pips = [3, 6, 10, 14, 18];
  const mcps = [2, 5, 9, 13, 17];

  let count = 0;

  for (let f = 0; f < 5; f++) {
    const tip = lm[tips[f]], pip = lm[pips[f]], mcp = lm[mcps[f]];

    // Method A: tip.y < pip.y (y-coordinate, works for palm-facing-camera)
    const methodY = tip.y < pip.y - 0.015;

    // Method B: tip distance from palm > pip distance from palm (rotation-invariant)
    const dTipPalm = d3(tip, pc);
    const dPipPalm = d3(pip, pc);
    const methodPalm = dTipPalm > dPipPalm * 1.35;

    // Method C: angle at PIP joint
    const v1x = pip.x-mcp.x, v1y = pip.y-mcp.y;
    const v2x = tip.x-pip.x, v2y = tip.y-pip.y;
    const dot = v1x*v2x + v1y*v2y;
    const m1 = Math.sqrt(v1x*v1x+v1y*v1y) || .001;
    const m2 = Math.sqrt(v2x*v2x+v2y*v2y) || .001;
    const ang = Math.acos(Math.max(-1,Math.min(1,dot/(m1*m2)))) * 180 / Math.PI;
    const methodAng = ang > 145;

    // Thumb special handling
    if (f === 0) {
      const idxMcp = lm[5];
      const spread = d2(tip, idxMcp);
      const thumbExtended = spread > handSz * 0.35;
      // Thumb: need spread + at least one method
      if (thumbExtended && (methodY || methodPalm)) count++;
    } else {
      // Majority vote: at least 2 out of 3 methods agree
      let votes = methodY + methodPalm + methodAng;
      if (this && this._debugFingers) {
        // Store for debug
        if (!this._debugData) this._debugData = {};
        this._debugData[f] = { y: methodY, palm: methodPalm, ang: methodAng, votes };
      }
      if (votes >= 2) count++;
    }
  }

  return count;
}

// ═══════ SMOOTHING
let hist = [];
function smooth(v) {
  if (v < 0) return -1;
  hist.push(v);
  if (hist.length > C.smooth) hist.shift();
  const t = {};
  for (const x of hist) t[x] = (t[x]||0)+1;
  let best = 0, bestN = 0;
  for (const [k,c] of Object.entries(t))
    if (c > bestN) { bestN = c; best = parseInt(k); }
  return bestN > hist.length/2 ? best : -1; // require majority
}

// ═══════ DEBUG SKETCH
function drawHand(lm, ctx, w, h) {
  ctx.clearRect(0, 0, w, h);
  if (!lm) return;

  const connections = [
    [0,1],[1,2],[2,3],[3,4],        // thumb
    [0,5],[5,6],[6,7],[7,8],        // index
    [0,9],[9,10],[10,11],[11,12],   // middle
    [0,13],[13,14],[14,15],[15,16], // ring
    [0,17],[17,18],[18,19],[19,20], // pinky
    [5,9],[9,13],[13,17]            // palm
  ];

  // Lines
  ctx.strokeStyle = 'rgba(6,182,212,.35)';
  ctx.lineWidth = 1.5;
  for (const [i,j] of connections) {
    ctx.beginPath();
    ctx.moveTo(lm[i].x*w, lm[i].y*h);
    ctx.lineTo(lm[j].x*w, lm[j].y*h);
    ctx.stroke();
  }

  // Fingertip dots
  const tips = [4, 8, 12, 16, 20];
  const colors = ['#f472b6','#22d3ee','#818cf8','#34d399','#fbbf24'];
  for (let f = 0; f < 5; f++) {
    const t = lm[tips[f]];
    ctx.fillStyle = colors[f];
    ctx.beginPath();
    ctx.arc(t.x*w, t.y*h, 4, 0, Math.PI*2);
    ctx.fill();
  }

  // Wrist dot
  ctx.fillStyle = '#64748b';
  ctx.beginPath();
  ctx.arc(lm[0].x*w, lm[0].y*h, 3, 0, Math.PI*2);
  ctx.fill();
}

// ═══════ PARTICLE SYSTEM
class PS {
  constructor() {
    this.N = C.N;
    this.pos = new Float32Array(this.N*3);
    this.vel = new Float32Array(this.N*3);
    this.acc = new Float32Array(this.N*3);
    this.tgt = new Float32Array(this.N*3);
    this.siz = new Float32Array(this.N);
    this.col = new Float32Array(this.N*3);
    this.key = null;
    this.storm = {x:0,y:0,z:0};
    this.depth = 1;
    this.boomT = 0; this.boomD = 0.25; this.boom = false;
    this.rot = 0; this._debugFingers = true; this._debugData = {};

    const s = rndPts(this.N, 4.5);
    this.pos.set(s); this.tgt.set(s);
    for (let i = 0; i < this.N; i++) {
      this.siz[i] = 0.025 + Math.random() * 0.055;
      this.col[i*3] = 0.1 + Math.random() * 0.3;
      this.col[i*3+1] = 0.4 + Math.random() * 0.5;
      this.col[i*3+2] = 0.5 + Math.random() * 0.5;
    }
    this._gl();
  }

  _gl() {
    this.r = new THREE.WebGLRenderer({ canvas: mainCanvas, antialias: true });
    this.r.setPixelRatio(Math.min(devicePixelRatio, 2));
    this.r.setSize(innerWidth, innerHeight);
    this.r.setClearColor(0x070714);

    this.s = new THREE.Scene();
    this.c = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
    this.c.position.z = 5.5;

    // Stars
    const sg = new THREE.BufferGeometry();
    const sp = new Float32Array(500*3);
    for (let i = 0; i < 500; i++) {
      sp[i*3] = (Math.random()-.5)*50;
      sp[i*3+1] = (Math.random()-.5)*50;
      sp[i*3+2] = (Math.random()-.5)*50-12;
    }
    sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
    const sm = new THREE.PointsMaterial({ color: 0x334488, size: 0.025, transparent: true, opacity: 0.3 });
    this.s.add(new THREE.Points(sg, sm));

    // Connector lines
    const cn = 120;
    this.cNodes = new Float32Array(cn*3);
    for (let i = 0; i < cn; i++) {
      this.cNodes[i*3] = (Math.random()-.5)*4;
      this.cNodes[i*3+1] = (Math.random()-.5)*4;
      this.cNodes[i*3+2] = (Math.random()-.5)*4;
    }
    this.cPairs = [];
    for (let i = 0; i < cn; i++)
      for (let j = i+1; j < cn; j++)
        if (Math.random() < 0.05) this.cPairs.push([i,j]);

    const lp = new Float32Array(this.cPairs.length*6);
    const lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.BufferAttribute(lp, 3));
    const lm = new THREE.LineBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.06, blending: THREE.AdditiveBlending });
    this.lines = new THREE.LineSegments(lg, lm);
    this.s.add(this.lines);
    this._lp = lp;

    // Particles
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(this.siz, 1));
    geo.setAttribute('color', new THREE.BufferAttribute(this.col, 3));

    const vs = `
      attribute float size; attribute vec3 color;
      varying vec3 vc; varying float va;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (350.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
        vc = color; va = 0.6 + 0.4 * (1.0 - abs(position.x) / 8.0);
      }
    `;
    const fs = `
      varying vec3 vc; varying float va; uniform float t;
      void main() {
        vec2 c = gl_PointCoord - vec2(0.5);
        float d = length(c);
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.0, d) * va * 0.85;
        float g = exp(-d * 12.0);
        vec3 col = vc + vec3(0.15, 0.2, 0.25) * g;
        gl_FragColor = vec4(col, a);
      }
    `;
    const mat = new THREE.ShaderMaterial({
      uniforms: { t: { value: 0 } },
      vertexShader: vs, fragmentShader: fs,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    });
    this.mesh = new THREE.Points(geo, mat);
    this.s.add(this.mesh);

    onresize = () => {
      this.c.aspect = innerWidth/innerHeight;
      this.c.updateProjectionMatrix();
      this.r.setSize(innerWidth, innerHeight);
    };
  }

  setTarget(k) {
    if (k === this.key) return;
    this.key = k;
    const g = G[k]; if (!g) return;
    this.tgt.set(g.g());
    this.boom = true; this.boomT = 0;
    for (let i = 0; i < this.N; i++) {
      this.vel[i*3] += (Math.random()-.5)*C.boom;
      this.vel[i*3+1] += (Math.random()-.5)*C.boom;
      this.vel[i*3+2] += (Math.random()-.5)*C.boom;
    }
    glTxt.textContent = `${k} · ${G[k].l}`;
    gl.classList.add('glow');
    glNum.textContent = k;
    glNum.classList.add('ok');
    setTimeout(() => gl.classList.remove('glow'), 1000);
  }

  addStorm(dx, dy, s) {
    this.storm.x += dx*s; this.storm.y += dy*s; this.storm.z += (Math.random()-.5)*s*.15;
  }
  setDepth(s) { this.depth = s; }

  update(dt) {
    dt = Math.min(dt, 0.05);
    this.rot += dt * 0.06;

    if (this.boom) { this.boomT += dt; if (this.boomT > this.boomD) this.boom = false; }
    const ep = this.boom ? Math.min(this.boomT/this.boomD, 1) : 1;
    const sd = Math.exp(-dt*4);
    const attr = this.boom ? C.speed*0.5 : C.speed;
    const df = this.depth > 1.1 ? (this.depth-1)*C.depthSens*3 : this.depth < 0.85 ? -(1-this.depth)*C.depthSens*3 : 0;

    // Update connector nodes
    for (let i = 0; i < this.cNodes.length/3; i++) {
      this.cNodes[i*3] += (Math.random()-.5)*.004;
      this.cNodes[i*3+1] += (Math.random()-.5)*.004;
      this.cNodes[i*3+2] += (Math.random()-.5)*.004;
      this.cNodes[i*3] *= .99; this.cNodes[i*3+1] *= .99; this.cNodes[i*3+2] *= .99;
    }

    const lp = this._lp, pairs = this.cPairs;
    let idx = 0;
    for (const [i,j] of pairs) {
      const dx = this.cNodes[i*3]-this.cNodes[j*3];
      const dy = this.cNodes[i*3+1]-this.cNodes[j*3+1];
      const dz = this.cNodes[i*3+2]-this.cNodes[j*3+2];
      if (Math.sqrt(dx*dx+dy*dy+dz*dz) < 2) {
        lp[idx*3]=this.cNodes[i*3]; lp[idx*3+1]=this.cNodes[i*3+1]; lp[idx*3+2]=this.cNodes[i*3+2];
        lp[(idx+1)*3]=this.cNodes[j*3]; lp[(idx+1)*3+1]=this.cNodes[j*3+1]; lp[(idx+1)*3+2]=this.cNodes[j*3+2];
        idx++;
      }
    }
    for (let i = idx*6; i < lp.length; i++) lp[i] = 0;
    this.lines.geometry.attributes.position.needsUpdate = true;
    this.lines.geometry.setDrawRange(0, idx*2);

    const cr = Math.cos(this.rot), sr = Math.sin(this.rot);

    for (let i = 0; i < this.N; i++) {
      const i3 = i*3;
      const dx = this.tgt[i3]-this.pos[i3];
      const dy = this.tgt[i3+1]-this.pos[i3+1];
      const dz = this.tgt[i3+2]-this.pos[i3+2];

      this.acc[i3] = dx*attr + this.storm.x*(1-ep) + this.pos[i3]*df;
      this.acc[i3+1] = dy*attr + this.storm.y*(1-ep) + this.pos[i3+1]*df;
      this.acc[i3+2] = dz*attr + this.storm.z*(1-ep) + this.pos[i3+2]*df;

      this.vel[i3] += this.acc[i3]*dt;
      this.vel[i3+1] += this.acc[i3+1]*dt;
      this.vel[i3+2] += this.acc[i3+2]*dt;

      this.vel[i3] *= C.damp;
      this.vel[i3+1] *= C.damp;
      this.vel[i3+2] *= C.damp;

      // Rotate
      const px = this.pos[i3], pz = this.pos[i3+2];
      this.pos[i3] = this.pos[i3] + this.vel[i3]*dt;
      this.pos[i3+1] += this.vel[i3+1]*dt;
      this.pos[i3+2] = pz + this.vel[i3+2]*dt;
    }

    this.storm.x *= sd; this.storm.y *= sd; this.storm.z *= sd;
    this.mesh.geometry.attributes.position.needsUpdate = true;
    this.mesh.material.uniforms.t.value += dt;
  }

  render() { this.r.render(this.s, this.c); }
}

let ps;

// ═══════ HAND TRACKING
let hpos = [];
let prevK = -1, cd = 0, idle = 0;
let lastLM = null;

function onHand(r) {
  if (!r.multiHandLandmarks || !r.multiHandLandmarks.length) {
    idle += 0.03;
    if (idle > 1.5) {
      glTxt.textContent = '👋 等待手势';
      glNum.textContent = '-';
      glNum.classList.remove('ok');
    }
    lastLM = null;
    // Clear debug
    const dc = debugCanvas.getContext('2d');
    if (dc) dc.clearRect(0, 0, debugCanvas.width, debugCanvas.height);
    return;
  }
  idle = 0;
  const lm = r.multiHandLandmarks[0];
  lastLM = lm;

  // Storm
  const cx = lm[0].x, cy = lm[0].y;
  hpos.push({x:cx,y:cy});
  if (hpos.length > 6) hpos.shift();
  if (hpos.length >= 3) {
    const p1 = hpos[hpos.length-3], p2 = hpos[hpos.length-1];
    const sp = Math.sqrt((p2.x-p1.x)**2 + (p2.y-p1.y)**2);
    if (sp > C.stormThresh && ps)
      ps.addStorm((p2.x-p1.x)/sp, -(p2.y-p1.y)/sp, Math.min(sp*C.stormPow, C.stormPow*2));
  }

  // Depth
  let mx=1,xx=0,my=1,xy=0;
  for (const p of lm) { if(p.x<mx)mx=p.x; if(p.x>xx)xx=p.x; if(p.y<my)my=p.y; if(p.y>xy)xy=p.y; }
  const bboxArea = (xx-mx)*(xy-my);
  if (ps) ps.setDepth(Math.max(0.3, Math.min(4, bboxArea*15)));

  // Distance hint
  if (bboxArea < 0.04) distHint.textContent = '📏 手太远了，靠近一些 (30~50cm)';
  else if (bboxArea > 0.4) distHint.textContent = '📏 手太近了，离远一点';
  else distHint.textContent = '✅ 距离合适！';

  // Finger count
  cd -= 0.03;
  const raw = countFingers(lm);
  const k = smooth(raw);

  if (cd <= 0 && k >= 1 && k <= 5 && k !== prevK && ps) {
    prevK = k; cd = C.cooldown;
    ps.setTarget(k);
  }

  // Draw debug
  const dc = debugCanvas.getContext('2d');
  if (dc && debugCanvas.classList.contains('show')) {
    debugCanvas.width = debugCanvas.clientWidth * (devicePixelRatio||1);
    debugCanvas.height = debugCanvas.clientHeight * (devicePixelRatio||1);
    const s = debugCanvas.width / 160;
    dc.scale(s, s);
    drawHand(lm, dc, 160, 120);
  }
}

// ═══════ MOUSE
let mpos = [];
let cycle = 0;
const CYCLE = [1,2,3,4,5];

function setupMouse() {
  const h = (x,y) => {
    mpos.push({x,y});
    if (mpos.length > 6) mpos.shift();
    if (mpos.length >= 3) {
      const p1=mpos[mpos.length-3], p2=mpos[mpos.length-1];
      const sp=Math.sqrt((p2.x-p1.x)**2+(p2.y-p1.y)**2);
      if (sp > 0.01 && ps)
        ps.addStorm((p2.x-p1.x)/Math.max(sp,.001), -(p2.y-p1.y)/Math.max(sp,.001), Math.min(sp*350, 35));
    }
  };
  mainCanvas.addEventListener('mousemove', e => h(e.clientX/innerWidth, e.clientY/innerHeight));
  mainCanvas.addEventListener('click', () => { if(!ps)return; cycle=(cycle+1)%CYCLE.length; ps.setTarget(CYCLE[cycle]); });
  mainCanvas.addEventListener('touchmove', e => { e.preventDefault(); const t=e.touches[0]; h(t.clientX/innerWidth, t.clientY/innerHeight); }, {passive:false});
  mainCanvas.addEventListener('touchstart', e => { e.preventDefault(); if(!ps)return; cycle=(cycle+1)%CYCLE.length; ps.setTarget(CYCLE[cycle]); }, {passive:false});
  setTimeout(() => { if(ps) { ps.setTarget(1); glNum.textContent='1'; glNum.classList.add('ok'); glTxt.textContent='1 · 我'; } }, 600);
}

// ═══════ CAMERA
async function startCam() {
  prompt.classList.remove('show');
  guide.classList.add('hidden');
  distHint.classList.remove('hidden');
  debugCanvas.classList.add('show');

  try {
    const s = await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
    video.srcObject = s; await video.play();
    prog(60, '加载手势识别...');
    const hands = new Hands({ locateFile: f => `https://unpkg.com/@mediapipe/hands@0.4.1675469240/${f}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.3 });
    hands.onResults(onHand);
    const cam = new Camera(video, { onFrame: async () => { try { await hands.send({image:video}); } catch(e){} }, width: 640, height: 480 });
    prog(85, '就绪！'); await cam.start();
    prog(100); setTimeout(() => $('#loading').classList.add('hidden'), 200);
  } catch(e) {
    console.warn(e);
    glTxt.textContent = '🖱️ 鼠标模式 · 点击切换';
    debugCanvas.classList.remove('show');
    setupMouse(); prog(100); setTimeout(() => $('#loading').classList.add('hidden'), 200);
  }
}

function skipCam() {
  prompt.classList.remove('show');
  glTxt.textContent = '🖱️ 鼠标模式 · 点击切换形态';
  debugCanvas.classList.remove('show');
  setupMouse(); prog(100); setTimeout(() => $('#loading').classList.add('hidden'), 200);
}

// ═══════ BOOT
async function boot() {
  prog(10, '启动粒子...');
  ps = new PS();
  prog(50, '渲染就绪');
  await new Promise(r => setTimeout(r, 100));
  prompt.classList.add('show');
  $('#btn-cam').onclick = startCam;
  $('#btn-skip').onclick = skipCam;

  let last = performance.now();
  function loop() {
    const n = performance.now(), dt = (n-last)/1000;
    last = n;
    if (ps) { ps.update(dt); ps.render(); }
    requestAnimationFrame(loop);
  }
  loop();
}
boot();
</script>
