<script type="module">
import * as THREE from 'three';

// ═══════ CONFIG
const C = {
  N: 12000,
  speed: 120,
  boom: 15,
  damp: 0.65,
  stormThresh: 0.015,
  stormPow: 28,
  depthSens: 0.5,
  cooldown: 0.15,
  smooth: 4
};

// ═══════ DOM
const $ = s => document.querySelector(s);
const loadBar = $('#load-bar'), loadTxt = $('#load-text');
const glTxt = $('#gl-txt'), glNum = $('#gl-num'), gl = $('#gl');
const guide = $('#guide'), distHint = $('#dist-hint');
const prompt = $('#prompt'), video = $('#webcam');
const mainCanvas = $('#main'), debugCanvas = $('#debug');

function prog(p, t) {
  loadBar.style.width = p + '%';
  if (t) loadTxt.textContent = t;
}

// ═══════ 3D DIST
const d3 = (a, b) => Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2 + (a.z-b.z)**2);
const d2 = (a, b) => Math.sqrt((a.x-b.x)**2 + (a.y-b.y)**2);

// ═══════ TEXT → POSITIONS
function textPts(text, n, scale) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 160;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 512, 160);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  let fs = 95;
  if (text.length >= 4) fs = 62;
  else if (text.length >= 3) fs = 75;
  ctx.font = `bold ${fs}px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif`;
  ctx.fillText(text, 256, 80);
  const d = ctx.getImageData(0, 0, 512, 160).data;
  const pts = [];
  for (let y = 0; y < 160; y += 2)
    for (let x = 0; x < 512; x += 2)
      if (d[(y*512+x)*4] > 128)
        pts.push({ x: (x-256)/55*scale, y: (80-y)/55*scale });
  const pos = new Float32Array(n*3);
  if (pts.length < 5) {
    for (let i = 0; i < n; i++) {
      pos[i*3] = (Math.random()-0.5)*scale*2;
      pos[i*3+1] = (Math.random()-0.5)*scale*.6;
      pos[i*3+2] = (Math.random()-0.5)*scale*.2;
    }
    return pos;
  }
  for (let i = 0; i < n; i++) {
    const p = pts[Math.floor(Math.random()*pts.length)];
    pos[i*3] = p.x + (Math.random()-.5)*.03;
    pos[i*3+1] = p.y + (Math.random()-.5)*.03;
    pos[i*3+2] = (Math.random()-.5)*scale*.06;
  }
  return pos;
}

function heartPts(n, r) {
  // 3D heart shape with depth variation
  const p = new Float32Array(n*3);
  for (let i = 0; i < n; i++) {
    // Heart parametric: x = 16sin^3(t), y = 13cos(t) - 5cos(2t) - 2cos(3t) - cos(4t)
    const t = Math.random() * Math.PI * 2;
    const st = Math.sin(t);
    const hx = 16 * st * st * st;
    const hy = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    // Normalize to roughly unit size, add thickness
    const norm = 18;
    const thickness = 0.25 + Math.random() * 0.35;
    // Random angle for 3D depth
    const a = Math.random() * Math.PI * 2;
    const depthFactor = 1 - Math.abs(hy) / 18;
    p[i*3] = (hx / norm) * r * (0.9 + 0.1 * Math.random());
    p[i*3+1] = (hy / norm) * r * (0.9 + 0.1 * Math.random());
    p[i*3+2] = (Math.random() - 0.5) * thickness * r * (0.4 + 0.6 * depthFactor);
  }
  return p;
}

function rndPts(n, r) {
  const p = new Float32Array(n*3);
  for (let i = 0; i < n; i++) {
    p[i*3] = (Math.random()-.5)*r*2;
    p[i*3+1] = (Math.random()-.5)*r*2;
    p[i*3+2] = (Math.random()-.5)*r*2;
  }
  return p;
}

const G = {
  0: { l: '星空', g: () => rndPts(C.N, 5.5) },
  1: { l: '我', g: () => textPts('我', C.N, 2.0) },
  2: { l: '爱', g: () => textPts('爱', C.N, 2.0) },
  3: { l: '欣欣', g: () => textPts('欣欣', C.N, 2.2) },
  4: { l: '我爱欣欣', g: () => textPts('我爱欣欣', C.N, 2.5) },
  5: { l: '爱心', g: () => heartPts(C.N, 1.6) }
};

// ═══════ 🔥 ROBUST FINGER COUNTER (multi-method majority vote)
function countFingers(lm) {
  if (!lm || lm.length < 21) return -1;

  const wrist = lm[0], palm = lm[9];
  const handSz = d3(wrist, lm[5]); // wrist to index MCP
  if (handSz < 0.005) return -1;

  // Palm center
  const pc = {
    x: (lm[0].x+lm[5].x+lm[9].x+lm[13].x+lm[17].x)/5,
    y: (lm[0].y+lm[5].y+lm[9].y+lm[13].y+lm[17].y)/5,
    z: (lm[0].z+lm[5].z+lm[9].z+lm[13].z+lm[17].z)/5
  };

  const tips = [4, 8, 12, 16, 20];
  const pips = [3, 6, 10, 14, 18];
  const mcps = [2, 5, 9, 13, 17];

  let count = 0;

  for (let f = 0; f < 5; f++) {
    const tip = lm[tips[f]], pip = lm[pips[f]], mcp = lm[mcps[f]];

    // Method A: tip.y < pip.y (y-coordinate, works for palm-facing-camera)
    const methodY = tip.y < pip.y - 0.015;

    // Method B: tip distance from palm > pip distance from palm (rotation-invariant)
    const dTipPalm = d3(tip, pc);
    const dPipPalm = d3(pip, pc);
    const methodPalm = dTipPalm > dPipPalm * 1.35;

    // Method C: angle at PIP joint
    const v1x = pip.x-mcp.x, v1y = pip.y-mcp.y;
    const v2x = tip.x-pip.x, v2y = tip.y-pip.y;
    const dot = v1x*v2x + v1y*v2y;
    const m1 = Math.sqrt(v1x*v1x+v1y*v1y) || .001;
    const m2 = Math.sqrt(v2x*v2x+v2y*v2y) || .001;
    const ang = Math.acos(Math.max(-1,Math.min(1,dot/(m1*m2)))) * 180 / Math.PI;
    const methodAng = ang > 145;

    // Thumb special handling - much stricter to prevent folded thumb miscount
    if (f === 0) {
      // Wrist reference (landmark 0) - folded thumb is closer to wrist
      const wrist = lm[0];
      const idxMcp = lm[5];
      const spread = d2(tip, idxMcp);
      const tip2wrist = d3(lm[4], wrist);
      const midWrist = d3(lm[9], wrist);
      // Thumb must extend far from wrist relative to middle finger base
      const thumbExtended = spread > handSz * 0.55 && tip2wrist > midWrist * 0.7;
      // IP joint bending detection - much stricter
      const tip2pip = d3(lm[4], lm[3]);
      const pip2mcp = d3(lm[3], lm[2]);
      // If thumb IP is bent relative to MCP length, thumb is folded
      const thumbBent = tip2pip < pip2mcp * 0.5;
      // New: check thumb tip Y vs wrist Y - folded thumb stays low
      const thumbTipY = lm[4].y;
      const wristY = wrist.y;
      const isRaised = thumbTipY < wristY - 0.02;
      // Thumb counted only if ALL conditions pass
      if (thumbExtended && !thumbBent && isRaised && (methodY || methodPalm)) count++;
    } else {
      // Majority vote: at least 2 out of 3 methods agree
      let votes = methodY + methodPalm + methodAng;
      if (this && this._debugFingers) {
        // Store for debug
        if (!this._debugData) this._debugData = {};
        this._debugData[f] = { y: methodY, palm: methodPalm, ang: methodAng, votes };
      }
      if (votes >= 2) count++;
    }
  }

  return count;
}

// ═══════ SMOOTHING
let hist = [];
function smooth(v) {
  if (v < 0) return -1;
  hist.push(v);
  if (hist.length > C.smooth) hist.shift();
  const t = {};
  for (const x of hist) t[x] = (t[x]||0)+1;
  let best = 0, bestN = 0;
  for (const [k,c] of Object.entries(t))
    if (c > bestN) { bestN = c; best = parseInt(k); }
  return bestN > hist.length/2 ? best : -1; // require majority
}

// ═══════ DEBUG SKETCH
function drawHand(lm, ctx, w, h) {
  ctx.clearRect(0, 0, w, h);
  if (!lm) return;

  const connections = [
    [0,1],[1,2],[2,3],[3,4],        // thumb
    [0,5],[5,6],[6,7],[7,8],        // index
    [0,9],[9,10],[10,11],[11,12],   // middle
    [0,13],[13,14],[14,15],[15,16], // ring
    [0,17],[17,18],[18,19],[19,20], // pinky
    [5,9],[9,13],[13,17]            // palm
  ];

  // Lines
  ctx.strokeStyle = 'rgba(6,182,212,.35)';
  ctx.lineWidth = 1.5;
  for (const [i,j] of connections) {
    ctx.beginPath();
    ctx.moveTo(lm[i].x*w, lm[i].y*h);
    ctx.lineTo(lm[j].x*w, lm[j].y*h);
    ctx.stroke();
  }

  // Fingertip dots
  const tips = [4, 8, 12, 16, 20];
  const colors = ['#f472b6','#22d3ee','#818cf8','#34d399','#fbbf24'];
  for (let f = 0; f < 5; f++) {
    const t = lm[tips[f]];
    ctx.fillStyle = colors[f];
    ctx.beginPath();
    ctx.arc(t.x*w, t.y*h, 4, 0, Math.PI*2);
    ctx.fill();
  }

  // Wrist dot
  ctx.fillStyle = '#64748b';
  ctx.beginPath();
  ctx.arc(lm[0].x*w, lm[0].y*h, 3, 0, Math.PI*2);
  ctx.fill();
}

// ═══════ PARTICLE SYSTEM
class PS {
  constructor() {
    this.N = C.N;
    this.pos = new Float32Array(this.N*3);
    this.vel = new Float32Array(this.N*3);
    this.acc = new Float32Array(this.N*3);
    this.tgt = new Float32Array(this.N*3);
    this.siz = new Float32Array(this.N);
    this.baseSiz = new Float32Array(this.N);
    this.col = new Float32Array(this.N*3);
    this.key = null;
    this.storm = {x:0,y:0,z:0};
    this.depth = 1;
    this.boomT = 0; this.boomD = 0.35; this.boom = false;
    this.rot = 0; this._debugFingers = true; this._debugData = {};
    this.phases = new Float32Array(this.N);
    for (let i = 0; i < this.N; i++) this.phases[i] = Math.random() * Math.PI * 2;

    // Start as wide starfield for initial visual impact
    const s = rndPts(this.N, 5.5);
    this.pos.set(s); this.tgt.set(s);
    this.entrancePhase = true;
    this.entranceTimer = 0;
    for (let i = 0; i < this.N; i++) {
      this.siz[i] = 0.025 + Math.random() * 0.055;
      this.baseSiz[i] = this.siz[i];
      this.col[i*3] = 0.1 + Math.random() * 0.3;
      this.col[i*3+1] = 0.4 + Math.random() * 0.5;
      this.col[i*3+2] = 0.5 + Math.random() * 0.5;
    }
    this._gl();
  }

  _gl() {
    try {
      this.r = new THREE.WebGLRenderer({ canvas: mainCanvas, antialias: true });
    } catch(e) {
      console.error('WebGL init failed:', e);
      document.getElementById('loading').querySelector('p').textContent = '⚠️ WebGL初始化失败: ' + e.message;
      throw e;
    }
    this.r.setPixelRatio(Math.min(devicePixelRatio, 2));
    this.r.setSize(innerWidth, innerHeight);
    this.r.setClearColor(0x070714);

    this.s = new THREE.Scene();
    this.c = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
    this.c.position.z = 5.5;

    // Stars
    this.starCount = 500;
    this.starPos = new Float32Array(this.starCount*3);
    for (let i = 0; i < this.starCount; i++) {
      this.starPos[i*3] = (Math.random()-.5)*50;
      this.starPos[i*3+1] = (Math.random()-.5)*50;
      this.starPos[i*3+2] = (Math.random()-.5)*50-12;
    }
    const sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.BufferAttribute(this.starPos, 3));
    this.starMat = new THREE.PointsMaterial({ color: 0x334488, size: 0.025, transparent: true, opacity: 0.3 });
    this.starField = new THREE.Points(sg, this.starMat);
    this.s.add(this.starField);

    // Connector lines
    const cn = 120;
    this.cNodes = new Float32Array(cn*3);
    for (let i = 0; i < cn; i++) {
      this.cNodes[i*3] = (Math.random()-.5)*4;
      this.cNodes[i*3+1] = (Math.random()-.5)*4;
      this.cNodes[i*3+2] = (Math.random()-.5)*4;
    }
    this.cPairs = [];
    for (let i = 0; i < cn; i++)
      for (let j = i+1; j < cn; j++)
        if (Math.random() < 0.05) this.cPairs.push([i,j]);

    const lp = new Float32Array(this.cPairs.length*6);
    const lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.BufferAttribute(lp, 3));
    const lm = new THREE.LineBasicMaterial({ color: 0x06b6d4, transparent: true, opacity: 0.06, blending: THREE.AdditiveBlending });
    this.lines = new THREE.LineSegments(lg, lm);
    this.s.add(this.lines);
    this._lp = lp;

    // Shape connector lines (neural network effect between particles)
    this.sNodeCount = 180;
    this.sNodeIndices = new Uint16Array(this.sNodeCount);
    for (let i = 0; i < this.sNodeCount; i++) this.sNodeIndices[i] = Math.floor(Math.random() * this.N);
    this.sPairs = [];
    for (let i = 0; i < this.sNodeCount; i++) {
      for (let j = i+1; j < this.sNodeCount; j++) {
        if (Math.random() < 0.035) this.sPairs.push([i,j]);
      }
    }
    const slp = new Float32Array(this.sPairs.length*6);
    const slg = new THREE.BufferGeometry();
    slg.setAttribute("position", new THREE.BufferAttribute(slp, 3));
    const slm = new THREE.LineBasicMaterial({
      color: 0x6b6bff, transparent: true, opacity: 0.04,
      blending: THREE.AdditiveBlending
    });
    this.shapeLines = new THREE.LineSegments(slg, slm);
    this.s.add(this.shapeLines);
    this._slp = slp;
    this._shapeLinePairs = this.sPairs;

    // Particles
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(this.siz, 1));
    geo.setAttribute('color', new THREE.BufferAttribute(this.col, 3));

    const vs = `
      attribute float size; attribute vec3 color;
      varying vec3 vc; varying float va;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = size * (350.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
        vc = color; va = 0.6 + 0.4 * (1.0 - abs(position.x) / 8.0);
      }
    `;
    const fs = `
      varying vec3 vc; varying float va; uniform float t;
      void main() {
        vec2 c = gl_PointCoord - vec2(0.5);
        float d = length(c);
        if (d > 0.5) discard;
        float a = smoothstep(0.5, 0.0, d) * va * 0.85;
        float g = exp(-d * 12.0);
        vec3 col = vc + vec3(0.15, 0.2, 0.25) * g;
        gl_FragColor = vec4(col, a);
      }
    `;
    const mat = new THREE.ShaderMaterial({
      uniforms: { t: { value: 0 } },
      vertexShader: vs, fragmentShader: fs,
      transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    });
    this.mesh = new THREE.Points(geo, mat);
    this.s.add(this.mesh);

    // Ghost trail particles
    this.trailPos = new Float32Array(this.N * 3);
    this.trailPos.set(this.pos);
    const tg = new THREE.BufferGeometry();
    tg.setAttribute("position", new THREE.BufferAttribute(this.trailPos, 3));
    const tm = new THREE.PointsMaterial({
      color: 0x4488ff, size: 0.01, transparent: true, opacity: 0.08,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    this.trailMesh = new THREE.Points(tg, tm);
    this.s.add(this.trailMesh);

    onresize = () => {
      this.c.aspect = innerWidth/innerHeight;
      this.c.updateProjectionMatrix();
      this.r.setSize(innerWidth, innerHeight);
    };
  }

  setTarget(k) {
    if (k === this.key) return;
    this.key = k;
    const g = G[k]; if (!g) return;
    this.tgt.set(g.g());
    this.boom = true; this.boomT = 0;
    for (let i = 0; i < this.N; i++) {
      this.vel[i*3] += (Math.random()-.5)*C.boom;
      this.vel[i*3+1] += (Math.random()-.5)*C.boom;
      this.vel[i*3+2] += (Math.random()-.5)*C.boom;
    }
    // Per-gesture color themes
    if (k === 1) {
      // Purple
      for (let i = 0; i < this.N; i++) {
        this.col[i*3] = 0.45 + Math.random() * 0.35;
        this.col[i*3+1] = 0.05 + Math.random() * 0.15;
        this.col[i*3+2] = 0.55 + Math.random() * 0.35;
      }
    } else if (k === 2) {
      // Pink
      for (let i = 0; i < this.N; i++) {
        this.col[i*3] = 0.75 + Math.random() * 0.25;
        this.col[i*3+1] = 0.15 + Math.random() * 0.25;
        this.col[i*3+2] = 0.35 + Math.random() * 0.30;
      }
    } else if (k === 3) {
      // Gold
      for (let i = 0; i < this.N; i++) {
        this.col[i*3] = 0.80 + Math.random() * 0.20;
        this.col[i*3+1] = 0.55 + Math.random() * 0.30;
        this.col[i*3+2] = 0.05 + Math.random() * 0.15;
      }
    } else if (k === 4) {
      // Rainbow - cycle hue across particles
      for (let i = 0; i < this.N; i++) {
        const angle = (i / this.N) * Math.PI * 6;
        this.col[i*3] = 0.5 + 0.5 * Math.sin(angle);
        this.col[i*3+1] = 0.5 + 0.5 * Math.sin(angle + 2.1);
        this.col[i*3+2] = 0.5 + 0.5 * Math.sin(angle + 4.2);
      }
    } else if (k === 0) {
      // Starfield: blue scatter
      for (let i = 0; i < this.N; i++) {
        this.col[i*3] = 0.1 + Math.random() * 0.3;
        this.col[i*3+1] = 0.4 + Math.random() * 0.5;
        this.col[i*3+2] = 0.5 + Math.random() * 0.5;
      }
    } else if (k === 5) {
      // Red heart
      for (let i = 0; i < this.N; i++) {
        this.col[i*3] = 0.7 + Math.random() * 0.3;
        this.col[i*3+1] = 0.05 + Math.random() * 0.15;
        this.col[i*3+2] = 0.1 + Math.random() * 0.2;
      }
    }
    // Restore base sizes when leaving heart (but keep starfield sizes)
    if (this.key !== 5) {
      if (this.key === 0) {
        for (let i = 0; i < this.N; i++)
          this.siz[i] = 0.025 + Math.random() * 0.055;
        this.mesh.geometry.attributes.size.needsUpdate = true;
      } else {
        for (let i = 0; i < this.N; i++)
          this.siz[i] = this.baseSiz[i];
        this.mesh.geometry.attributes.size.needsUpdate = true;
      }
    }
    this.mesh.geometry.attributes.color.needsUpdate = true;
    glTxt.textContent = `${k} · ${G[k].l}`;
    gl.classList.add('glow');
    glNum.textContent = k;
    glNum.classList.add('ok');
    setTimeout(() => gl.classList.remove('glow'), 1000);
  }

  addStorm(dx, dy, s) {
    this.storm.x += dx*s; this.storm.y += dy*s; this.storm.z += (Math.random()-.5)*s*.15;
  }
  setDepth(s) { this.depth = s; }

  update(dt) {
    dt = Math.min(dt, 0.05);
    this.rot += dt * 0.06;

    // Entrance phase: particles gently awaken from starfield
    if (this.entrancePhase) {
      this.entranceTimer += dt;
      if (this.entranceTimer > 0.5 && this.entranceTimer < 0.55) {
        // Gentle converge pulse
        for (let i = 0; i < this.N * 3; i++) {
          this.vel[i] += (Math.random() - 0.5) * 2.0;
        }
        this.boom = true;
        this.boomT = 0;
      }
      if (this.entranceTimer > 3.0) {
        this.entrancePhase = false;
      }
    }

    if (this.boom) { this.boomT += dt; if (this.boomT > this.boomD) this.boom = false; }
    const ep = this.boom ? Math.min(this.boomT/this.boomD, 1) : 1;
    const sd = Math.exp(-dt*4);
    const attr = this.boom ? C.speed*0.5 : C.speed;
    // Depth → shape scale: hand closer = bigger shape
    const rawD = this.depth;
    let shapeScale = 1.0;
    if (rawD > 1.1) shapeScale = 1.0 + (rawD - 1.0) * 0.6;
    else if (rawD < 0.85) shapeScale = 0.5 + rawD * 0.5;
    shapeScale = Math.max(0.5, Math.min(3.0, shapeScale));
    const df = 0; // replaced by shapeScale

    // Update connector nodes
    for (let i = 0; i < this.cNodes.length/3; i++) {
      this.cNodes[i*3] += (Math.random()-.5)*.004;
      this.cNodes[i*3+1] += (Math.random()-.5)*.004;
      this.cNodes[i*3+2] += (Math.random()-.5)*.004;
      this.cNodes[i*3] *= .99; this.cNodes[i*3+1] *= .99; this.cNodes[i*3+2] *= .99;
    }

    const lp = this._lp, pairs = this.cPairs;
    let idx = 0;
    for (const [i,j] of pairs) {
      const dx = this.cNodes[i*3]-this.cNodes[j*3];
      const dy = this.cNodes[i*3+1]-this.cNodes[j*3+1];
      const dz = this.cNodes[i*3+2]-this.cNodes[j*3+2];
      if (Math.sqrt(dx*dx+dy*dy+dz*dz) < 2) {
        lp[idx*3]=this.cNodes[i*3]; lp[idx*3+1]=this.cNodes[i*3+1]; lp[idx*3+2]=this.cNodes[i*3+2];
        lp[(idx+1)*3]=this.cNodes[j*3]; lp[(idx+1)*3+1]=this.cNodes[j*3+1]; lp[(idx+1)*3+2]=this.cNodes[j*3+2];
        idx++;
      }
    }
    for (let i = idx*6; i < lp.length; i++) lp[i] = 0;
    this.lines.geometry.attributes.position.needsUpdate = true;
    this.lines.geometry.setDrawRange(0, idx*2);

    // Update shape connectors - track actual particle positions
    const slp = this._slp, sPairs = this._shapeLinePairs;
    let sidx = 0;
    for (const [i,j] of sPairs) {
      const ni = this.sNodeIndices[i], nj = this.sNodeIndices[j];
      const dx = this.pos[ni*3] - this.pos[nj*3];
      const dy = this.pos[ni*3+1] - this.pos[nj*3+1];
      const dz = this.pos[ni*3+2] - this.pos[nj*3+2];
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (dist < 0.8) {
        slp[sidx*3]=this.pos[ni*3]; slp[sidx*3+1]=this.pos[ni*3+1]; slp[sidx*3+2]=this.pos[ni*3+2];
        slp[(sidx+1)*3]=this.pos[nj*3]; slp[(sidx+1)*3+1]=this.pos[nj*3+1]; slp[(sidx+1)*3+2]=this.pos[nj*3+2];
        sidx++;
      }
    }
    for (let i = sidx*6; i < slp.length; i++) slp[i] = 0;
    this.shapeLines.geometry.attributes.position.needsUpdate = true;
    this.shapeLines.geometry.setDrawRange(0, sidx*2);

    // Floating & heartbeat time (must be before star rotation!)
    const ft = performance.now() / 1000;

    // Star field rotation + twinkle
    const starRot = ft * 0.008;
    const sr_cos = Math.cos(starRot), sr_sin = Math.sin(starRot);
    for (let i = 0; i < this.starCount; i++) {
      const i3 = i*3;
      const x = this.starPos[i3], z = this.starPos[i3+2];
      this.starPos[i3] = x * sr_cos + z * sr_sin;
      this.starPos[i3+2] = -x * sr_sin + z * sr_cos;
    }
    this.starField.geometry.attributes.position.needsUpdate = true;
    this.starMat.opacity = 0.25 + 0.08 * Math.sin(ft * 0.3);

    const cr = Math.cos(this.rot), sr = Math.sin(this.rot);

    // Floating & heartbeat time
    const floatAmp = this.boom ? 0 : 0.055;
    // Heartbeat pulse for heart shape - particle size + warm glow
    if (this.key === 5) {
      const hb = 1 + 0.08 * Math.pow(Math.sin(ft * 8.0), 20);
      for (let i = 0; i < this.N; i++) {
        this.siz[i] = this.baseSiz[i] * hb;
      }
      this.mesh.geometry.attributes.size.needsUpdate = true;
      // Also pulse Z position slightly for "throb" feel
      const throb = 1 + 0.008 * Math.pow(Math.sin(ft * 8.0), 20);
      this.c.position.z = 5.5 / throb;
    }

    for (let i = 0; i < this.N; i++) {
      const i3 = i*3;
      // Floating offset - gentle sine wave around target
      const fx = Math.sin(ft * 0.7 + this.phases[i]) * floatAmp;
      const fy = Math.cos(ft * 0.5 + this.phases[i] * 1.3) * floatAmp;
      const fz = Math.sin(ft * 0.6 + this.phases[i] * 0.7) * floatAmp * 0.5;
      const stgt = shapeScale;
      const dx = (this.tgt[i3]*stgt + fx) - this.pos[i3];
      const dy = (this.tgt[i3+1]*stgt + fy) - this.pos[i3+1];
      const dz = (this.tgt[i3+2]*stgt + fz) - this.pos[i3+2];

      this.acc[i3] = dx*attr + this.storm.x*(1-ep);
      this.acc[i3+1] = dy*attr + this.storm.y*(1-ep);
      this.acc[i3+2] = dz*attr + this.storm.z*(1-ep);

      this.vel[i3] += this.acc[i3]*dt;
      this.vel[i3+1] += this.acc[i3+1]*dt;
      this.vel[i3+2] += this.acc[i3+2]*dt;

      this.vel[i3] *= C.damp;
      this.vel[i3+1] *= C.damp;
      this.vel[i3+2] *= C.damp;

      // Rotate
      const px = this.pos[i3], pz = this.pos[i3+2];
      this.pos[i3] = this.pos[i3] + this.vel[i3]*dt;
      this.pos[i3+1] += this.vel[i3+1]*dt;
      this.pos[i3+2] = pz + this.vel[i3+2]*dt;
    }

    this.storm.x *= sd; this.storm.y *= sd; this.storm.z *= sd;
    this.mesh.geometry.attributes.position.needsUpdate = true;

    // Trail: ghost particles chase current positions
    const trailSpd = this.boom ? 0.06 : 0.025;
    for (let i = 0; i < this.N * 3; i++)
      this.trailPos[i] += (this.pos[i] - this.trailPos[i]) * trailSpd;
    this.trailMesh.geometry.attributes.position.needsUpdate = true;

    this.mesh.material.uniforms.t.value += dt;
  }

  render() { this.r.render(this.s, this.c); }
}

let ps;

// ═══════ HAND TRACKING
let hpos = [];
let prevK = -1, cd = 0, idle = 0;
let lastLM = null;

function onHand(r) {
  if (!r.multiHandLandmarks || !r.multiHandLandmarks.length) {
    idle += 0.03;
    if (idle > 1.5) {
      glTxt.textContent = '👋 等待手势';
      glNum.textContent = '-';
      glNum.classList.remove('ok');
    }
    lastLM = null;
    // Clear debug
    const dc = debugCanvas.getContext('2d');
    if (dc) dc.clearRect(0, 0, debugCanvas.width, debugCanvas.height);
    return;
  }
  idle = 0;
  const lm = r.multiHandLandmarks[0];
  lastLM = lm;

  // Storm
  const cx = lm[0].x, cy = lm[0].y;
  hpos.push({x:cx,y:cy});
  if (hpos.length > 6) hpos.shift();
  if (hpos.length >= 3) {
    const p1 = hpos[hpos.length-3], p2 = hpos[hpos.length-1];
    const sp = Math.sqrt((p2.x-p1.x)**2 + (p2.y-p1.y)**2);
    if (sp > C.stormThresh && ps)
      ps.addStorm((p2.x-p1.x)/sp, -(p2.y-p1.y)/sp, Math.min(sp*C.stormPow, C.stormPow*2));
  }

  // Depth
  let mx=1,xx=0,my=1,xy=0;
  for (const p of lm) { if(p.x<mx)mx=p.x; if(p.x>xx)xx=p.x; if(p.y<my)my=p.y; if(p.y>xy)xy=p.y; }
  const bboxArea = (xx-mx)*(xy-my);
  if (ps) ps.setDepth(Math.max(0.3, Math.min(4, bboxArea*15)));

  // Distance hint
  if (bboxArea < 0.04) distHint.textContent = '📏 手太远了，靠近一些 (30~50cm)';
  else if (bboxArea > 0.4) distHint.textContent = '📏 手太近了，离远一点';
  else distHint.textContent = '✅ 距离合适！';

  // Finger count
  cd -= 0.03;
  const raw = countFingers(lm);
  const k = smooth(raw);

  if (cd <= 0 && k >= 0 && k <= 5 && k !== prevK && ps) {
    prevK = k; cd = C.cooldown;
    ps.setTarget(k);
  }

  // Draw debug
  const dc = debugCanvas.getContext('2d');
  if (dc && debugCanvas.classList.contains('show')) {
    debugCanvas.width = debugCanvas.clientWidth * (devicePixelRatio||1);
    debugCanvas.height = debugCanvas.clientHeight * (devicePixelRatio||1);
    const s = debugCanvas.width / 160;
    dc.scale(s, s);
    drawHand(lm, dc, 160, 120);
  }
}

// ═══════ MOUSE
let mpos = [];
let cycle = 0;
const CYCLE = [0,1,2,3,4,5];

function setupMouse() {
  const h = (x,y) => {
    mpos.push({x,y});
    if (mpos.length > 6) mpos.shift();
    if (mpos.length >= 3) {
      const p1=mpos[mpos.length-3], p2=mpos[mpos.length-1];
      const sp=Math.sqrt((p2.x-p1.x)**2+(p2.y-p1.y)**2);
      if (sp > 0.01 && ps)
        ps.addStorm((p2.x-p1.x)/Math.max(sp,.001), -(p2.y-p1.y)/Math.max(sp,.001), Math.min(sp*350, 35));
    }
  };
  mainCanvas.addEventListener('mousemove', e => h(e.clientX/innerWidth, e.clientY/innerHeight));
  mainCanvas.addEventListener('click', () => { if(!ps)return; cycle=(cycle+1)%CYCLE.length; ps.setTarget(CYCLE[cycle]); });
  mainCanvas.addEventListener('touchmove', e => { e.preventDefault(); const t=e.touches[0]; h(t.clientX/innerWidth, t.clientY/innerHeight); }, {passive:false});
  mainCanvas.addEventListener('touchstart', e => { e.preventDefault(); if(!ps)return; cycle=(cycle+1)%CYCLE.length; ps.setTarget(CYCLE[cycle]); }, {passive:false});
    setTimeout(() => { if(ps) { ps.setTarget(0); glNum.textContent='0'; glNum.classList.add('ok'); glTxt.textContent='0 · 星空'; } }, 600);
}

// ═══════ CAMERA
async function startCam() {
  prompt.classList.remove('show');
  guide.classList.add('hidden');
  distHint.classList.remove('hidden');
  debugCanvas.classList.add('show');
  // Auto-hide guide on mobile after 3s
  setTimeout(function() {
    var g = document.getElementById('guide');
    if (g) g.classList.add('fade');
  }, 3000);

  // Camera timeout: 15s fallback
  const camTimeout = new Promise(function(_, reject) {
    setTimeout(function() { reject(new Error('摄像头启动超时，请检查权限设置')); }, 15000);
  });
  try {
    const s = await Promise.race([
      navigator.mediaDevices.getUserMedia({video:{width:320,height:240,facingMode:'user'}})
        .catch(function(){ return navigator.mediaDevices.getUserMedia({video:{width:320,height:240}}); }),
      camTimeout
    ]);
    video.srcObject = s;
    await Promise.race([video.play(), new Promise(function(_, reject) { setTimeout(function() { reject(new Error('视频播放超时')); }, 8000); })]);
    prog(60, '加载手势识别...');
    const hands = new Hands({ locateFile: function(f) { return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/' + f; } });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.3 });
    hands.onResults(onHand);
    prog(85, '就绪！');
    var frameCount = 0;
    var mpReady = true;
    (function processFrame() {
      if (!mpReady) return;
      mpReady = false;
      try { hands.send({image:video}).then(function(){ mpReady = true; }).catch(function(){ mpReady = true; }); } catch(e) { mpReady = true; }
      if (++frameCount < 5) setTimeout(processFrame, 100);
      else requestAnimationFrame(processFrame);
    })();
    await new Promise(function(r) { setTimeout(r, 200); });
    prog(100); setTimeout(function() { document.getElementById('loading').classList.add('hidden'); }, 200);
  } catch(e) {
    console.warn('Camera init failed:', e);
    glTxt.textContent = '🖱️ 鼠标模式 · 点击切换';
    debugCanvas.classList.remove('show');
    distHint.textContent = '⚠️ 摄像头不可用: ' + (e.message||'未知错误') + ' · 已切换鼠标模式';
    setTimeout(function() { distHint.textContent = '点击屏幕切换形态 · 快速滑动起风暴'; }, 5000);
    setupMouse(); prog(100); setTimeout(function() { document.getElementById('loading').classList.add('hidden'); }, 200);
  }
}



function skipCam() {
  prompt.classList.remove('show');
  setTimeout(function() { var g=document.getElementById('guide'); if(g) g.classList.add('fade'); }, 3000);
  glTxt.textContent = '🖱️ 鼠标模式 · 点击切换形态';
  debugCanvas.classList.remove('show');
  setupMouse(); prog(100); setTimeout(() => $('#loading').classList.add('hidden'), 200);
}

// ═══════ BOOT
async function boot() {
  prog(10, '启动粒子...');
  try {
    ps = new PS();
  } catch(e) {
    prog(0, '');
    throw new Error('粒子初始化失败: ' + e.message);
  }
  prog(50, '渲染就绪');
  await new Promise(r => setTimeout(r, 100));

  // Orientation check for mobile
  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (isMobile && window.innerWidth < window.innerHeight) {
    document.getElementById('rotate-prompt').classList.add('show');
    document.getElementById('btn-landscape-ok').onclick = function() {
      try { screen.orientation.lock('landscape'); } catch(e) {}
      document.getElementById('rotate-prompt').classList.remove('show');
    };
    document.getElementById('btn-landscape-skip').onclick = function() {
      document.getElementById('rotate-prompt').classList.remove('show');
    };
    window.addEventListener('orientationchange', function() {
      if (window.innerWidth > window.innerHeight)
        document.getElementById('rotate-prompt').classList.remove('show');
    });
  }

  prompt.classList.add('show');
  $('#btn-cam').onclick = startCam;
  $('#btn-skip').onclick = skipCam;

  let last = performance.now();
  function loop() {
    const n = performance.now(), dt = (n-last)/1000;
    last = n;
    if (ps) { ps.update(dt); ps.render(); }
    requestAnimationFrame(loop);
  }
  loop();
}
boot().catch(function(e) {
  console.error('Boot failed:', e);
  var ld = document.getElementById('loading');
  if (ld) {
    var detail = e.message || 'Unknown';
    if (e.stack) detail += ' | ' + e.stack.split('\n')[0];
    ld.querySelector('p').textContent = '⚠️ 启动失败: ' + detail;
    ld.querySelector('p').style.fontSize = '11px';
    ld.querySelector('p').style.maxWidth = '90%';
    ld.classList.remove('hidden');
    // Also show on screen
    var bar = ld.querySelector('.bar');
    if (bar) bar.style.display = 'none';
  }
});
