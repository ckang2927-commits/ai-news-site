<script type="module">
import * as THREE from 'three';

// ══════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════
const CFG = {
  particleCount: 24000,
  spreadRadius: 5,
  transitionSpeed: 5.5,
  explosionForce: 4,
  damping: 0.91,
  stormThreshold: 0.03,
  stormForce: 18,
  depthSensitivity: 0.7,
  gestureCooldown: 0.2,
  smoothingFrames: 5,
  fingerAngleThreshold: 140
};

// ══════════════════════════════════════════
//  DOM
// ══════════════════════════════════════════
const $ = (s) => document.querySelector(s);
const loading = $('#loading');
const loadText = $('#load-text');
const loadProg = $('#load-progress');
const label = $('#gesture-label');
const hint = $('#hint');
const camPrompt = $('#camera-prompt');
const video = $('#webcam');
const canvas = document.createElement('canvas');
document.body.prepend(canvas);

function setProg(pct, msg) {
  loadProg.style.width = pct + '%';
  if (msg) loadText.textContent = msg;
}

// ══════════════════════════════════════════
//  TEXT → PARTICLE POSITIONS
// ══════════════════════════════════════════

function asteroidPositions(count, scale) {
  const pos = new Float32Array(count * 3);
  const body = Math.floor(count * 0.65);
  const ring = count - body;
  const s = scale * 1.5;
  for (let i = 0; i < body; i++) {
    const t = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    const r = s * (0.35 + Math.random() * 0.25) * (0.8 + 0.3 * Math.sin(t * 4) * Math.cos(ph * 3));
    pos[i*3] = r * Math.sin(ph) * Math.cos(t);
    pos[i*3+1] = r * Math.cos(ph);
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(t);
  }
  for (let i = 0; i < ring; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = s * (0.7 + Math.random() * 0.6);
    const idx = body + i;
    pos[idx*3] = r * Math.cos(a);
    pos[idx*3+1] = r * Math.sin(a) * 0.35 + (Math.random() - 0.5) * s * 0.05;
    pos[idx*3+2] = r * Math.sin(a) * 0.6;
  }
  return pos;
}
function textToPositions(text, count, scale) {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 160;
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, c.width, c.height);

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  let fontSize = 90;
  if (text.length >= 4) fontSize = 60;
  else if (text.length >= 3) fontSize = 72;
  ctx.font = `bold ${fontSize}px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif`;
  ctx.fillText(text, c.width / 2, c.height / 2);

  const img = ctx.getImageData(0, 0, c.width, c.height);
  const d = img.data;
  const pts = [];
  const step = 2;
  for (let y = 0; y < c.height; y += step) {
    for (let x = 0; x < c.width; x += step) {
      if (d[(y * c.width + x) * 4] > 128) {
        pts.push({
          x: (x - c.width / 2) / 55 * scale,
          y: (c.height / 2 - y) / 55 * scale
        });
      }
    }
  }

  const pos = new Float32Array(count * 3);
  if (pts.length === 0) {
    // Fallback: random positions
    for (let i = 0; i < count; i++) {
      pos[i*3] = (Math.random() - 0.5) * scale * 2;
      pos[i*3+1] = (Math.random() - 0.5) * scale * 0.6;
      pos[i*3+2] = (Math.random() - 0.5) * scale * 0.2;
    }
    return pos;
  }

  for (let i = 0; i < count; i++) {
    const p = pts[Math.floor(Math.random() * pts.length)];
    pos[i*3] = p.x + (Math.random() - 0.5) * 0.04;
    pos[i*3+1] = p.y + (Math.random() - 0.5) * 0.04;
    pos[i*3+2] = (Math.random() - 0.5) * scale * 0.1;
  }
  return pos;
}

function spherePositions(count, radius) {
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3] = radius * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = radius * Math.cos(ph);
    pos[i*3+2] = radius * Math.sin(ph) * Math.sin(th);
  }
  return pos;
}

function randomSpread(count, r) {
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i*3] = (Math.random() - 0.5) * r * 2;
    pos[i*3+1] = (Math.random() - 0.5) * r * 2;
    pos[i*3+2] = (Math.random() - 0.5) * r * 2;
  }
  return pos;
}

// ══════════════════════════════════════════
//  FINGER COUNTER (angle-based, robust)
function countFingers(lm) {
  if (!lm || lm.length < 21) return -1;
  let n = 0;
  if (lm[4].y < lm[3].y - 0.02 && Math.sqrt((lm[4].x-lm[5].x)**2 + (lm[4].y-lm[5].y)**2) > 0.04) n++;
  if (lm[8].y < lm[6].y - 0.02) n++;
  if (lm[12].y < lm[10].y - 0.02) n++;
  if (lm[16].y < lm[14].y - 0.02) n++;
  if (lm[20].y < lm[18].y - 0.02) n++;
  return n;
}
let fingerHistory = [];
function smoothCount(raw) {
  if (raw < 0) return -1;
  fingerHistory.push(raw);
  if (fingerHistory.length > CFG.smoothingFrames) fingerHistory.shift();

  const tally = {};
  for (const v of fingerHistory) {
    tally[v] = (tally[v] || 0) + 1;
  }
  let best = 0, bestN = 0;
  for (const [k, v] of Object.entries(tally)) {
    if (v > bestN) { bestN = v; best = parseInt(k); }
  }
  return best;
}

// ══════════════════════════════════════════
//  GESTURE MAP
// ══════════════════════════════════════════
const GESTURE_MAP = {
  0: { label: '✊ 小行星', gen: () => asteroidPositions(CFG.particleCount, 1.8) },
  1: { label: '☝️ 我', gen: () => textToPositions('我', CFG.particleCount, 2.0) },
  2: { label: '✌️ 爱', gen: () => textToPositions('爱', CFG.particleCount, 2.0) },
  3: { label: '🤟 欣欣', gen: () => textToPositions('欣欣', CFG.particleCount, 2.2) },
  4: { label: '🖐️ 我爱欣欣', gen: () => textToPositions('我爱欣欣', CFG.particleCount, 2.5) },
  5: { label: '✋ 球形', gen: () => spherePositions(CFG.particleCount, 1.8) }
};

// ══════════════════════════════════════════
//  PARTICLE SYSTEM
// ══════════════════════════════════════════
class ParticleSys {
  constructor() {
    this.N = CFG.particleCount;
    this.pos = new Float32Array(this.N * 3);
    this.vel = new Float32Array(this.N * 3);
    this.acc = new Float32Array(this.N * 3);
    this.tgt = new Float32Array(this.N * 3);
    this.siz = new Float32Array(this.N);
    this.currentKey = null;
    this.storm = { x: 0, y: 0, z: 0 };
    this.depth = 1;
    this.explodeTimer = 0;
    this.explodeDur = 0.35;
    this.isExploding = false;

    this.initSpread();
    this.setupGL();
  }

  initSpread() {
    const s = randomSpread(this.N, CFG.spreadRadius);
    this.pos.set(s);
    this.vel.fill(0);
    this.acc.fill(0);
    this.tgt.set(s); this.baseTgt = new Float32Array(this.N * 3); this.baseTgt.set(s);
    for (let i = 0; i < this.N; i++) {
      this.siz[i] = 0.025 + Math.random() * 0.045;
    }
  }

  setupGL() {
    this.renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: false,
      antialias: true
    });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setClearColor(0x0a0a1a);

    this.scene = new THREE.Scene();
    this.cam = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    this.cam.position.z = 5.5;

    // Background stars
    const sg = new THREE.BufferGeometry();
    const sp = new Float32Array(300 * 3);
    for (let i = 0; i < 300; i++) {
      sp[i*3] = (Math.random() - 0.5) * 30;
      sp[i*3+1] = (Math.random() - 0.5) * 30;
      sp[i*3+2] = (Math.random() - 0.5) * 30 - 8;
    }
    sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
    const sm = new THREE.PointsMaterial({ color: 0x334466, size: 0.025, transparent: true, opacity: 0.4 });
    this.scene.add(new THREE.Points(sg, sm));

    // Particle geometry
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(this.siz, 1));

    const vs = `
      attribute float size;
      varying float vA;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position,1.0);
        gl_PointSize = size * (280.0 / -mv.z);
        gl_Position = projectionMatrix * mv;
        vA = .5 + .5 * (1.0 - abs(position.x) / 6.0);
      }
    `;
    const fs = `
      uniform vec3 c1; uniform vec3 c2; uniform float t;
      varying float vA;
      void main(){
        vec2 c = gl_PointCoord - vec2(.5);
        float d = length(c);
        if(d > .5) discard;
        float a = smoothstep(.5, 0., d) * vA * .9;
        float g = exp(-d * 8.);
        vec3 col = mix(c1, c2, d*2. + .3*sin(t + gl_PointCoord.x*12.));
        gl_FragColor = vec4(col, a);
      }
    `;
    const mat = new THREE.ShaderMaterial({
      uniforms: {
        c1: { value: new THREE.Color('#06b6d4') },
        c2: { value: new THREE.Color('#818cf8') },
        t: { value: 0 }
      },
      vertexShader: vs,
      fragmentShader: fs,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    this.mesh = new THREE.Points(geo, mat);
    this.scene.add(this.mesh);
    this.time = 0;

    window.addEventListener('resize', () => {
      this.cam.aspect = window.innerWidth / window.innerHeight;
      this.cam.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });
  }

  setTarget(key) {
    if (key === this.currentKey) return;
    this.currentKey = key;

    const g = GESTURE_MAP[key];
    if (!g) return;

    const newTgt = g.gen();
    this.tgt.set(newTgt); this.baseTgt.set(newTgt);

    this.isExploding = true;
    this.explodeTimer = 0;

    for (let i = 0; i < this.N; i++) {
      this.vel[i*3] += (Math.random() - 0.5) * CFG.explosionForce;
      this.vel[i*3+1] += (Math.random() - 0.5) * CFG.explosionForce;
      this.vel[i*3+2] += (Math.random() - 0.5) * CFG.explosionForce;
    }

    label.textContent = g.label;
    label.classList.add('active');
    setTimeout(() => label.classList.remove('active'), 1500);

    return g.label;
  }

  addStorm(dx, dy, strength) {
    this.storm.x += dx * strength;
    this.storm.y += dy * strength;
    this.storm.z += (Math.random() - 0.5) * strength * 0.2;
  }

  setDepth(s) { this.depth = s; }

  update(dt) {
    dt = Math.min(dt, 0.05);

    if (this.isExploding) {
      this.explodeTimer += dt;
      if (this.explodeTimer > this.explodeDur) this.isExploding = false;
    }
    const ep = this.isExploding ? Math.min(this.explodeTimer / this.explodeDur, 1) : 1;

    const sd = Math.exp(-dt * 4);
    const attract = this.isExploding ? CFG.transitionSpeed * 0.4 : CFG.transitionSpeed;

    const dp = this.depth;
    const push = dp > 1.1 ? (dp - 1) * CFG.depthSensitivity * 2 : 0;
    const pull = dp < 0.9 ? (1 - dp) * CFG.depthSensitivity * 2 : 0;
    const depthFactor = push - pull;

    for (let i = 0; i < this.N; i++) {
      const i3 = i * 3;
      const isText = this.key >= 1 && this.key <= 4 ? 1 : 0;
      const wx = Math.sin(this.time * 1.8 + this.baseTgt[i3] * 4 + this.baseTgt[i3+1] * 3) * 0.04 * isText;
      const wy = Math.sin(this.time * 1.4 + this.baseTgt[i3+1] * 4 + this.baseTgt[i3] * 2) * 0.04 * isText;

      this.acc[i3] = dx * attract + this.storm.x * (1 - ep) + this.pos[i3] * depthFactor;
      this.acc[i3+1] = dy * attract + this.storm.y * (1 - ep) + this.pos[i3+1] * depthFactor;
      this.acc[i3+2] = dz * attract + this.storm.z * (1 - ep) + this.pos[i3+2] * depthFactor;

      this.vel[i3] += this.acc[i3] * dt;
      this.vel[i3+1] += this.acc[i3+1] * dt;
      this.vel[i3+2] += this.acc[i3+2] * dt;

      this.vel[i3] *= CFG.damping;
      this.vel[i3+1] *= CFG.damping;
      this.vel[i3+2] *= CFG.damping;

      this.pos[i3] += this.vel[i3] * dt;
      this.pos[i3+1] += this.vel[i3+1] * dt;
      this.pos[i3+2] += this.vel[i3+2] * dt;
    }

    this.storm.x *= sd;
    this.storm.y *= sd;
    this.storm.z *= sd;

    this.mesh.geometry.attributes.position.needsUpdate = true;
    this.mesh.material.uniforms.t.value += dt;
    this.time += dt;
  }

  render() { this.renderer.render(this.scene, this.cam); }
}

let ps;

// ══════════════════════════════════════════
//  HAND TRACKING
// ══════════════════════════════════════════
let lastPositions = [];
let prevCount = -1;
let cooldown = 0;
let noHand = 0;

function onHandResults(results) {
  if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
    noHand += 0.03;
    if (noHand > 2) label.textContent = '✊ 握拳试试';
    return;
  }

  noHand = 0;
  const lm = results.multiHandLandmarks[0];

  // Storm
  const cx = lm[0].x, cy = lm[0].y;
  lastPositions.push({ x: cx, y: cy });
  if (lastPositions.length > 5) lastPositions.shift();

  if (lastPositions.length >= 3) {
    const p1 = lastPositions[lastPositions.length - 3];
    const p2 = lastPositions[lastPositions.length - 1];
    const speed = Math.sqrt((p2.x-p1.x)**2 + (p2.y-p1.y)**2);
    if (speed > CFG.stormThreshold && ps) {
      ps.addStorm(
        (p2.x-p1.x) / speed,
        -(p2.y-p1.y) / speed,
        Math.min(speed * CFG.stormForce, CFG.stormForce * 2)
      );
    }
  }

  // Depth
  let mnX = 1, mxX = 0, mnY = 1, mxY = 0;
  for (const p of lm) {
    if (p.x < mnX) mnX = p.x; if (p.x > mxX) mxX = p.x;
    if (p.y < mnY) mnY = p.y; if (p.y > mxY) mxY = p.y;
  }
  const area = (mxX - mnX) * (mxY - mnY);
  if (ps) ps.setDepth(Math.max(0.4, Math.min(3, area * 10)));

  // Finger count
  cooldown -= 0.03;
  if (cooldown > 0) return;

  const raw = countFingers(lm);
  const count = smoothCount(raw);

  if (count >= 0 && count <= 5 && count !== prevCount && ps) {
    prevCount = count;
    cooldown = CFG.gestureCooldown;
    ps.setTarget(count);
  }
}

// ══════════════════════════════════════════
//  MOUSE / TOUCH FALLBACK
// ══════════════════════════════════════════
let mousePts = [];
let cycleIdx = 0;
const CYCLE = [0, 1, 2, 3, 4, 5];

function setupMouse() {
  const handler = (x, y) => {
    mousePts.push({ x, y });
    if (mousePts.length > 5) mousePts.shift();

    if (mousePts.length >= 3) {
      const p1 = mousePts[mousePts.length - 3];
      const p2 = mousePts[mousePts.length - 1];
      const speed = Math.sqrt((p2.x-p1.x)**2 + (p2.y-p1.y)**2);
      if (speed > 0.015 && ps) {
        ps.addStorm(
          (p2.x-p1.x) / Math.max(speed, 0.001),
          -(p2.y-p1.y) / Math.max(speed, 0.001),
          Math.min(speed * 250, 25)
        );
      }
    }
  };

  canvas.addEventListener('mousemove', (e) => {
    handler(e.clientX / window.innerWidth, e.clientY / window.innerHeight);
  });

  canvas.addEventListener('click', () => {
    if (!ps) return;
    cycleIdx = (cycleIdx + 1) % CYCLE.length;
    ps.setTarget(CYCLE[cycleIdx]);
  });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    handler(t.clientX / window.innerWidth, t.clientY / window.innerHeight);
  }, { passive: false });

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (!ps) return;
    cycleIdx = (cycleIdx + 1) % CYCLE.length;
    ps.setTarget(CYCLE[cycleIdx]);
  }, { passive: false });

  // Start with 1 finger
  setTimeout(() => { if (ps) ps.setTarget(0);
    }, 800);
}

// ══════════════════════════════════════════
//  CAMERA INIT
// ══════════════════════════════════════════
async function startCamera() {
  camPrompt.classList.remove('show');
  hint.classList.add('hidden');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: 640, height: 480, facingMode: 'user' }
    });
    video.srcObject = stream;
    await video.play();

    setProg(60, '加载手势识别模型...');

    const hands = new Hands({
      locateFile: (f) => `https://unpkg.com/@mediapipe/hands@0.4.1675469240/${f}`
    });
    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.4
    });
    hands.onResults(onHandResults);

    const cam = new Camera(video, {
      onFrame: async () => {
        try { await hands.send({ image: video }); } catch (e) { /* ignore */ }
      },
      width: 640, height: 480
    });

    setProg(80, '手势识别就绪！');
    await cam.start();
    setProg(100, '加载完成！');
    setTimeout(() => loading.classList.add('hidden'), 400);
  } catch (err) {
    console.warn('Camera failed:', err);
    label.textContent = '🖱️ 鼠标/触控模式（点击切换）';
    setupMouse();
    setProg(100, '鼠标/触控模式');
    setTimeout(() => loading.classList.add('hidden'), 400);
  }
}

function skipCamera() {
  camPrompt.classList.remove('show');
  label.textContent = '🖱️ 鼠标/触控模式（点击切换形态）';
  setupMouse();
  setProg(100, '鼠标/触控模式');
  setTimeout(() => loading.classList.add('hidden'), 400);
}

// ══════════════════════════════════════════
//  BOOT
// ══════════════════════════════════════════
async function boot() {
  setProg(10, '启动粒子系统...');
  ps = new ParticleSys();
  setProg(40, 'Three.js 就绪');

  await new Promise(r => setTimeout(r, 200));
  camPrompt.classList.add('show');

  $('#btn-start-camera').addEventListener('click', startCamera);
  $('#btn-skip-camera').addEventListener('click', skipCamera);

  let last = performance.now();
  function loop() {
    const now = performance.now();
    const dt = (now - last) / 1000;
    last = now;
    if (ps) { ps.update(dt); ps.render(); }
    requestAnimationFrame(loop);
  }
  loop();
}

boot();
</script>
