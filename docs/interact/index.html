#gl .n.ok{background:rgba(6,182,212,.12);color:#22d3ee;box-shadow:0 0 10px rgba(6,182,212,.08)}

function setupM(){const h=(x,y)=>{mPos.push({x,y});if(mPos.length>6)mPos.shift();if(mPos.length>=3){const p1=mPos[mPos.length-3],p2=mPos[mPos.length-1];const sp=Math.sqrt((p2.x-p1.x)**2+(p2.y-p1.y)**2);if(sp>.01&&ps)ps.addStorm((p2.x-p1.x)/Math.max(sp,.001),-(p2.y-p1.y)/Math.max(sp,.001),Math.min(sp*350,35))}};mc.addEventListener("mousemove",e=>h(e.clientX/innerWidth,e.clientY/innerHeight));mc.addEventListener("click",()=>{if(!ps)return;cyc=(cyc+1)%CYC.length;ps.setTarget(CYC[cyc])});mc.addEventListener("touchmove",e=>{e.preventDefault();const t=e.touches[0];h(t.clientX/innerWidth,t.clientY/innerHeight)},{passive:false});mc.addEventListener("touchstart",e=>{e.preventDefault();if(!ps)return;cyc=(cyc+1)%CYC.length;ps.setTarget(CYC[cyc])},{passive:false});setTimeout(()=>{if(ps){ps.setTarget(0);gn.textContent="0";gn.classList.add("ok");gt.textContent="0 · 小行星"}},600)}
async function startC(){pm.classList.remove("show");hint.classList.add("hidden");dh.classList.remove("hidden");dc.classList.add("show");try{const s=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:"user"}});w.srcObject=s;await w.play();pr(60,"加载识别...");const h2=new Hands({locateFile:f=>"https://unpkg.com/@mediapipe/hands@0.4.1675469240/"+f});h2.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.5,minTrackingConfidence:.3});h2.onResults(onH);const cm=new Camera(w,{onFrame:async()=>{try{await h2.send({image:w})}catch(e){}},width:640,height:480});pr(85,"就绪！");await cm.start();pr(100);setTimeout(()=>$("#loading").classList.add("hidden"),200)}catch(e){console.warn(e);gt.textContent="🖱️ 鼠标模式 · 点击切换";dc.classList.remove("show");setupM();pr(100);setTimeout(()=>$("#loading").classList.add("hidden"),200)}}
function skipC(){pm.classList.remove("show");gt.textContent="🖱️ 鼠标模式 · 点击切换形态";dc.classList.remove("show");setupM();pr(100);setTimeout(()=>$("#loading").classList.add("hidden"),200)}
async function boot(){pr(10,"启动粒子...");ps=new PS();pr(50,"渲染就绪");await new Promise(r=>setTimeout(r,100));pm.classList.add("show");$("#b1").onclick=startC;$("#b2").onclick=skipC;let last=performance.now();function loop(){const n=performance.now(),dt=(n-last)/1000;last=n;if(ps){ps.update(dt);ps.render()}requestAnimationFrame(loop)}loop()}
