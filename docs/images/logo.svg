<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1" />
      <stop offset="100%" style="stop-color:#06b6d4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Neural network icon - stylized brain/AI node -->
  <g filter="url(#glow)">
    <!-- Central hexagon core -->
    <polygon points="30,8 45,16 45,32 30,40 15,32 15,16" fill="none" stroke="url(#g1)" stroke-width="2.5"/>
    <!-- Inner nodes -->
    <circle cx="30" cy="24" r="4" fill="#818cf8" opacity="0.9"/>
    <!-- Network connections -->
    <line x1="30" y1="24" x2="22" y2="12" stroke="#22d3ee" stroke-width="1.2" opacity="0.7"/>
    <line x1="30" y1="24" x2="38" y2="12" stroke="#22d3ee" stroke-width="1.2" opacity="0.7"/>
    <line x1="30" y1="24" x2="22" y2="36" stroke="#a78bfa" stroke-width="1.2" opacity="0.7"/>
    <line x1="30" y1="24" x2="38" y2="36" stroke="#a78bfa" stroke-width="1.2" opacity="0.7"/>
    <!-- Outer nodes -->
    <circle cx="22" cy="12" r="2.5" fill="#22d3ee" opacity="0.8"/>
    <circle cx="38" cy="12" r="2.5" fill="#22d3ee" opacity="0.8"/>
    <circle cx="22" cy="36" r="2.5" fill="#a78bfa" opacity="0.8"/>
    <circle cx="38" cy="36" r="2.5" fill="#a78bfa" opacity="0.8"/>
    <!-- Connection between outer nodes -->
    <line x1="22" y1="12" x2="15" y2="16" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
    <line x1="38" y1="12" x2="45" y2="16" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
    <line x1="22" y1="36" x2="15" y2="32" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
    <line x1="38" y1="36" x2="45" y2="32" stroke="#6366f1" stroke-width="1" opacity="0.5"/>
    <!-- Sparkle dots -->
    <circle cx="18" cy="24" r="1.5" fill="#67e8f9" opacity="0.6"/>
    <circle cx="42" cy="24" r="1.5" fill="#67e8f9" opacity="0.6"/>
  </g>
  <!-- Text: AI -->
  <text x="58" y="26" font-family="Orbitron, Arial, sans-serif" font-weight="800" font-size="20" fill="url(#logoGrad)" letter-spacing="1.5">AI</text>
  <!-- Text: 资讯站 -->
  <text x="58" y="46" font-family="Noto Sans SC, Arial, sans-serif" font-weight="500" font-size="14" fill="#94a3b8" letter-spacing="2">资讯站</text>
</svg>