<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.3"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="url(#g)" stroke-width="1.5" opacity="0.5"/>
  <!-- Particles -->
  <circle cx="50" cy="20" r="3" fill="#06b6d4" opacity="0.9"><animate attributeName="cy" values="20;80;20" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0.3;0.9" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="30" cy="35" r="2.5" fill="#22d3ee" opacity="0.8"><animate attributeName="cx" values="30;70;30" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="70" cy="65" r="2" fill="#818cf8" opacity="0.7"><animate attributeName="cy" values="65;30;65" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="20" cy="60" r="2" fill="#06b6d4" opacity="0.6"><animate attributeName="cx" values="20;80;20" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="65" cy="30" r="2.5" fill="#22d3ee" opacity="0.7"><animate attributeName="cy" values="30;70;30" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="40" cy="80" r="2" fill="#818cf8" opacity="0.6"><animate attributeName="cx" values="40;60;40" dur="3s" repeatCount="indefinite"/></circle>
  <!-- Hand silhouette -->
  <path d="M45 55 L45 40 M45 42 L40 38 M45 42 L50 38 M45 48 L38 44 M45 48 L52 44 M45 54 L36 52 M45 54 L54 52" stroke="url(#g)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Gesture labels -->
  <text x="50" y="92" text-anchor="middle" fill="#94a3b8" font-size="6" font-family="sans-serif">✋ ✌️ ✊ ☝️ 👍</text>
  <!-- Connection lines -->
  <line x1="50" y1="20" x2="30" y2="35" stroke="#06b6d4" stroke-width="0.5" opacity="0.3"/>
  <line x1="30" y1="35" x2="50" y2="50" stroke="#22d3ee" stroke-width="0.5" opacity="0.2"/>
  <line x1="70" y1="65" x2="50" y2="50" stroke="#818cf8" stroke-width="0.5" opacity="0.2"/>
  <line x1="20" y1="60" x2="50" y2="50" stroke="#06b6d4" stroke-width="0.5" opacity="0.15"/>
</svg>
