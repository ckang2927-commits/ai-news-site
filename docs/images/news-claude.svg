<svg xmlns="http://www.w3.org/2000/svg" width="800" height="200" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C8C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB3B3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="20" fill="url(#bg)"/>
  <!-- Q版 Claude 小精灵 -->
  <g transform="translate(680,80)">
    <!-- 身体 -->
    <ellipse cx="0" cy="20" rx="35" ry="30" fill="white" opacity="0.9"/>
    <!-- 头 -->
    <circle cx="0" cy="-10" r="28" fill="white"/>
    <!-- 耳朵 -->
    <ellipse cx="-22" cy="-25" rx="10" ry="14" fill="white" transform="rotate(-15,-22,-25)"/>
    <ellipse cx="22" cy="-25" rx="10" ry="14" fill="white" transform="rotate(15,22,-25)"/>
    <!-- 耳朵内粉色 -->
    <ellipse cx="-20" cy="-24" rx="6" ry="9" fill="#FFB3B3" transform="rotate(-15,-20,-24)"/>
    <ellipse cx="20" cy="-24" rx="6" ry="9" fill="#FFB3B3" transform="rotate(15,20,-24)"/>
    <!-- 眼睛 - 大眼 -->
    <ellipse cx="-10" cy="-15" rx="7" ry="8" fill="#2D3748"/>
    <ellipse cx="10" cy="-15" rx="7" ry="8" fill="#2D3748"/>
    <!-- 眼睛高光 -->
    <circle cx="-8" cy="-18" r="3" fill="white" opacity="0.8"/>
    <circle cx="12" cy="-18" r="3" fill="white" opacity="0.8"/>
    <!-- 腮红 -->
    <ellipse cx="-16" cy="-6" rx="6" ry="3" fill="#FF6B6B" opacity="0.3"/>
    <ellipse cx="16" cy="-6" rx="6" ry="3" fill="#FF6B6B" opacity="0.3"/>
    <!-- 嘴巴 - 微笑 -->
    <path d="M-6,-4 Q0,2 6,-4" stroke="#2D3748" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- 小手 -->
    <ellipse cx="-28" cy="15" rx="8" ry="6" fill="white" opacity="0.8"/>
    <ellipse cx="28" cy="15" rx="8" ry="6" fill="white" opacity="0.8"/>
  </g>
  <!-- 标题 -->
  <text x="40" y="85" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="800" fill="white" letter-spacing="1">Claude Code</text>
  <text x="40" y="125" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="rgba(255,255,255,0.9)">终端智能编程助手</text>
  <!-- 装饰小元素 -->
  <circle cx="100" cy="160" r="15" fill="rgba(255,255,255,0.15)"/>
  <circle cx="160" cy="170" r="8" fill="rgba(255,255,255,0.12)"/>
  <circle cx="580" cy="170" r="10" fill="rgba(255,255,255,0.12)"/>
</svg>